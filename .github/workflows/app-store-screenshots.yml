# Uploads each app's App Store screenshots (apps/<name>/store/screenshots/<language>/)
# to App Store Connect when they change on main. Sets that already match are skipped,
# so running it for every app is cheap. See docs/ios-release.md.
name: App Store screenshots

on:
  push:
    branches: [main]
    paths:
      - apps/*/store/screenshots/**
      - scripts/ios/asc.py
      - scripts/ios/asc-upload-screenshots.py
      - .github/workflows/app-store-screenshots.yml
  workflow_dispatch:
    inputs:
      app:
        description: App folder name (like squawk). Empty does every app.
        required: false
        type: string
        default: ""

concurrency:
  group: app-store-screenshots
  cancel-in-progress: false

jobs:
  upload:
    name: Upload
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ONLY_APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v5

      - name: Upload screenshots
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::warning::Skipping: set the ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY repo secrets (see docs/ios-release.md)."
            exit 0
          fi
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT

          for folder in apps/*/store/screenshots; do
            [ -d "$folder" ] || continue
            app=$(basename "$(dirname "$(dirname "$folder")")")
            if [ -n "$ONLY_APP" ] && [ "$app" != "$ONLY_APP" ]; then continue; fi
            # The app's bundle ID is the shortest one in its xcconfigs (extensions add a suffix).
            bundle_id=$(grep -h '^PRODUCT_BUNDLE_IDENTIFIER' apps/$app/ios/Config/*.xcconfig \
              | sed 's/.*= *//' | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2)
            echo "::group::$app ($bundle_id)"
            python3 scripts/ios/asc-upload-screenshots.py "$bundle_id" "$folder"
            echo "::endgroup::"
          done

          # Subscriptions: changes only apply on main; anywhere else they're printed.
          apply=""
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then apply="--apply"; fi
          for store in apps/*/store; do
            app=$(basename "$(dirname "$store")")
            if [ -n "$ONLY_APP" ] && [ "$app" != "$ONLY_APP" ]; then continue; fi
            bundle_id=$(grep -h '^PRODUCT_BUNDLE_IDENTIFIER' apps/$app/ios/Config/*.xcconfig \
              | sed 's/.*= *//' | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2)
            echo "::group::$app subscriptions"
            python3 scripts/ios/asc-subscriptions.py "$bundle_id" "$store/subscriptions.json" $apply
            echo "::endgroup::"
          done
