name: Astrotype train

# Retrains the handwriting model on everything recorded in the app and, if
# the new model scores better, commits it to main and starts a TestFlight
# build. Start it from the Actions tab (or the GitHub app): Run workflow.
#
# Off until a dedicated training Mac is set up: register it as a self-hosted
# runner with the label `astrotype`, then set the repo variable
# ASTROTYPE_TRAINER to `on` (Settings → Secrets and variables → Actions →
# Variables). Until then, train with apps/astrotype/ml/train_and_ship.sh.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes of training
        default: "6"
      force:
        description: Train even if nothing new was recorded
        type: boolean
        default: false

concurrency:
  group: astrotype-train
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  train:
    if: vars.ASTROTYPE_TRAINER == 'on'
    runs-on: [self-hosted, macOS, astrotype]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/astrotype/ml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          # coremltools 9 can't export on Python 3.14
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/astrotype/ml/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Train
        id: train
        env:
          CLOUDKIT_KEY_ID: ${{ secrets.CLOUDKIT_KEY_ID }}
          CLOUDKIT_PRIVATE_KEY: ${{ secrets.CLOUDKIT_PRIVATE_KEY }}
        run: |
          # Without these secrets, the key in the Mac's ~/.config/astrotype is used.
          if [ -n "$CLOUDKIT_PRIVATE_KEY" ]; then
            export CLOUDKIT_KEY_PATH="$RUNNER_TEMP/cloudkit-key.pem"
            printf '%s\n' "$CLOUDKIT_PRIVATE_KEY" > "$CLOUDKIT_KEY_PATH"
            trap 'rm -f "$CLOUDKIT_KEY_PATH"' EXIT
          else
            unset CLOUDKIT_KEY_ID
          fi
          args=(--minutes "${{ inputs.minutes }}")
          if [ "${{ inputs.force }}" = "true" ]; then args+=(--force); fi
          python3 train_and_ship.py "${args[@]}"

      - name: Check the app's recognizer still matches
        if: steps.train.outputs.shipped == 'true'
        run: swift test --package-path ../ios/AstrotypeKit

      - name: Commit and start the TestFlight build
        if: steps.train.outputs.shipped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export models ../ios/Astrotype/Model
          { echo "Astrotype: model trained on recorded samples"; echo; cat runs/report.md; } > "$RUNNER_TEMP/msg"
          git commit -F "$RUNNER_TEMP/msg"
          git push origin HEAD:main
          # Pushes made with the workflow's token don't start other workflows, so start the build directly.
          gh workflow run astrotype-ios.yml --ref main -f deploy=true
