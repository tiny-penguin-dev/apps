# Reusable workflow: build an iOS app, and optionally ship it to TestFlight.
# Each app has a small caller workflow (see stackwrite-ios.yml) that passes
# its folder and scheme. Shared by every iOS app in the repo.
name: iOS app

on:
  workflow_call:
    inputs:
      app-dir:
        description: Folder that holds the app's .xcodeproj (e.g. apps/stackwrite/ios)
        required: true
        type: string
      scheme:
        description: Xcode scheme (also the .xcodeproj name)
        required: true
        type: string
      test-package:
        description: Local Swift packages to run `swift test` on before the build, relative to app-dir, separated by spaces (optional)
        required: false
        type: string
        default: ""
      deploy:
        description: Archive and upload to TestFlight after the build
        required: false
        type: boolean
        default: false
      sentry-project:
        description: Sentry project slug, to upload debug symbols after a TestFlight upload (optional, see docs/telemetry.md)
        required: false
        type: string
        default: ""
    secrets:
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      ASC_PRIVATE_KEY:
        required: false
      SENTRY_DSN:
        description: The app's Sentry DSN (optional override; normally looked up with SENTRY_AUTH_TOKEN)
        required: false
      SENTRY_AUTH_TOKEN:
        description: Sentry token (org:read, team:read, project:read, project:write, project:releases) to create the app's project, look up its DSN and upload debug symbols
        required: false

jobs:
  build:
    name: Build
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ${{ inputs.app-dir }}
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test Swift packages
        if: inputs.test-package != ''
        env:
          PACKAGES: ${{ inputs.test-package }}
        run: |
          set -e
          for package in $PACKAGES; do
            echo "::group::swift test $package"
            swift test --package-path "$package"
            echo "::endgroup::"
          done

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ inputs.scheme }}.xcodeproj" \
            -scheme "${{ inputs.scheme }}" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    name: TestFlight
    needs: build
    if: inputs.deploy
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ${{ inputs.app-dir }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ inputs.sentry-project }}
    steps:
      - name: Check App Store Connect secrets
        id: secrets
        working-directory: .
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::warning::Skipping TestFlight upload: set the ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY repo secrets (see docs/ios-release.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'

      - name: Write API key and read build settings
        if: steps.secrets.outputs.ready == 'true'
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"

          # Build number = commit time in UTC, so it always goes up.
          BUILD_NUMBER="$(TZ=UTC git show -s --format=%cd --date=format-local:'%Y%m%d%H%M' HEAD)"

          # The scheme can build more than one target (an app and its extensions, like a
          # widget), so read the app target's settings by name. Extensions are listed in
          # extensions.txt as "<bundle ID> <entitlements>" for the App Store Connect step.
          xcodebuild -showBuildSettings -json \
            -project "${{ inputs.scheme }}.xcodeproj" \
            -scheme "${{ inputs.scheme }}" \
            -configuration Release 2>/dev/null > "$RUNNER_TEMP/settings.json"
          python3 - "$RUNNER_TEMP/settings.json" "${{ inputs.scheme }}" "$RUNNER_TEMP/extensions.txt" > "$RUNNER_TEMP/app.env" <<'PY'
          import json, sys
          targets = json.load(open(sys.argv[1]))
          app = next(t["buildSettings"] for t in targets if t["target"] == sys.argv[2])
          for key in ("DEVELOPMENT_TEAM", "PRODUCT_BUNDLE_IDENTIFIER", "CODE_SIGN_ENTITLEMENTS"):
              print(f"{key}={app.get(key, '')}")
          with open(sys.argv[3], "w") as out:
              for t in targets:
                  b = t["buildSettings"]
                  if t["target"] != sys.argv[2] and b.get("WRAPPER_EXTENSION") == "appex":
                      out.write(f"{b['PRODUCT_BUNDLE_IDENTIFIER']} {b.get('CODE_SIGN_ENTITLEMENTS', '')}\n")
          PY
          setting() { awk -F= -v k="$1" '$1 == k { print substr($0, length(k) + 2); exit }' "$RUNNER_TEMP/app.env"; }
          TEAM_ID="$(setting DEVELOPMENT_TEAM)"
          BUNDLE_ID="$(setting PRODUCT_BUNDLE_IDENTIFIER)"
          ENTITLEMENTS="$(setting CODE_SIGN_ENTITLEMENTS)"
          if [ -z "$TEAM_ID" ] || [ -z "$BUNDLE_ID" ]; then
            echo "::error::DEVELOPMENT_TEAM or PRODUCT_BUNDLE_IDENTIFIER is not set in the build settings."
            exit 1
          fi
          echo "Build number: $BUILD_NUMBER, team: $TEAM_ID, bundle ID: $BUNDLE_ID"

          {
            echo "ASC_KEY_PATH=$KEY_PATH"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "TEAM_ID=$TEAM_ID"
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "ENTITLEMENTS=$ENTITLEMENTS"
            echo "ARCHIVE=$RUNNER_TEMP/${{ inputs.scheme }}.xcarchive"
          } >> "$GITHUB_ENV"

      - name: Prepare App Store Connect
        if: steps.secrets.outputs.ready == 'true'
        # Registers the bundle ID if needed, turns on the capabilities its
        # entitlements need, and checks the app record exists.
        run: |
          set -e
          python3 "$GITHUB_WORKSPACE/scripts/ios/asc-prepare-app.py" "$BUNDLE_ID" "${{ inputs.scheme }}" "$ENTITLEMENTS"
          # Extensions (like a widget) need their own bundle IDs and capabilities.
          while read -r EXT_ID EXT_ENTITLEMENTS; do
            [ -n "$EXT_ID" ] || continue
            python3 "$GITHUB_WORKSPACE/scripts/ios/asc-prepare-app.py" "$EXT_ID" "${{ inputs.scheme }} ${EXT_ID##*.}" "$EXT_ENTITLEMENTS" extension
          done < "$RUNNER_TEMP/extensions.txt"

      - name: Sync TestFlight testers
        if: steps.secrets.outputs.ready == 'true' && hashFiles(format('{0}/Config/testflight.json', inputs.app-dir)) != ''
        run: python3 "$GITHUB_WORKSPACE/scripts/ios/asc-sync-testers.py" "$BUNDLE_ID" Config/testflight.json

      - name: Prepare Sentry
        if: steps.secrets.outputs.ready == 'true' && inputs.sentry-project != ''
        # Creates the app's Sentry project if it's missing and looks up its DSN.
        # A problem here only warns: the build ships with Sentry off.
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::No SENTRY_AUTH_TOKEN secret, so this build ships with Sentry off (see docs/telemetry.md)."
            exit 0
          fi
          python3 "$GITHUB_WORKSPACE/scripts/ios/sentry-prepare-app.py" "$SENTRY_PROJECT" "${{ inputs.scheme }}" \
            || echo "::warning::Couldn't set up Sentry, so this build ships with Sentry off."

      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          # Export keeps only the entitlements the archived app was signed with,
          # so an app with entitlements is signed ad hoc here (export re-signs it
          # properly); one without is archived unsigned.
          if [ -n "$ENTITLEMENTS" ]; then
            SIGNING=(CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES
                     PROVISIONING_PROFILE_SPECIFIER= DEVELOPMENT_TEAM="$TEAM_ID")
          else
            SIGNING=(CODE_SIGNING_ALLOWED=NO)
          fi
          # Apps that use Sentry read SENTRY_DSN into their Info.plist.
          if [ -n "$SENTRY_PROJECT" ] && [ -z "$SENTRY_DSN" ]; then
            echo "::warning::No Sentry DSN for $SENTRY_PROJECT, so this build won't send crash reports or metrics (see docs/telemetry.md)."
          fi
          xcodebuild archive \
            -project "${{ inputs.scheme }}.xcodeproj" \
            -scheme "${{ inputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SENTRY_DSN="$SENTRY_DSN" \
            "${SIGNING[@]}"

      - name: Check entitlements
        if: steps.secrets.outputs.ready == 'true' && env.ENTITLEMENTS != ''
        # Stop before uploading if any entitlement the app asks for is missing.
        run: |
          APP="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' | head -1)"
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/archived.plist"
          python3 - "$ENTITLEMENTS" "$RUNNER_TEMP/archived.plist" <<'PY'
          import plistlib, sys
          wanted = plistlib.load(open(sys.argv[1], "rb"))
          got = plistlib.load(open(sys.argv[2], "rb"))
          missing = [k for k in wanted if k not in got]
          if missing:
              sys.exit(f"::error::The archive is missing entitlements: {', '.join(missing)}")
          print("Archive has entitlements:", ", ".join(wanted))
          PY

      - name: Export and upload
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          # The archive is unsigned or ad hoc, so it carries no team: the export
          # options name it. Export signs with cloud-managed distribution signing
          # and uploads straight to App Store Connect. iCloud apps get the
          # production CloudKit environment.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
            <key>iCloudContainerEnvironment</key><string>Production</string>
          </dict>
          </plist>
          PLIST

          # Signing with the API key can't create an iCloud container or link it
          # to the app ID; that's a one-time manual step (docs/ios-release.md).
          if ! xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"; then
            if [ -n "$ENTITLEMENTS" ] && grep -q icloud-container "$ENTITLEMENTS"; then
              echo "::error::Export failed. This app uses iCloud: make sure its container is registered and ticked on the app ID in the developer portal (see \"Entitlements\" in docs/ios-release.md), then re-run."
            fi
            exit 1
          fi

          echo "Uploaded ${{ inputs.scheme }} build $BUILD_NUMBER to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug symbols to Sentry
        if: steps.secrets.outputs.ready == 'true' && inputs.sentry-project != ''
        # So crash reports show file names and line numbers. A failure here only
        # warns: the build is already in TestFlight.
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ]; then
            echo "::warning::Skipping the Sentry symbol upload: Sentry isn't set up (see docs/telemetry.md)."
            exit 0
          fi
          npx --yes @sentry/cli@3.8.2 debug-files upload \
            --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
            --include-sources "$ARCHIVE/dSYMs" \
            || echo "::warning::Uploading debug symbols to Sentry failed. Crash reports for build $BUILD_NUMBER won't have line numbers."

      - name: Remove API key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
