name: Squawk iOS

on:
  push:
    branches: [main]
    paths:
      - apps/squawk/ios/**
      - config/ios/**
      - scripts/ios/**
      - .github/workflows/ios-app.yml
      - .github/workflows/squawk-ios.yml
  pull_request:
    paths:
      - apps/squawk/ios/**
      - config/ios/**
      - scripts/ios/**
      - .github/workflows/ios-app.yml
      - .github/workflows/squawk-ios.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload to TestFlight
        type: boolean
        default: true

concurrency:
  group: squawk-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    uses: ./.github/workflows/ios-app.yml
    with:
      app-dir: apps/squawk/ios
      scheme: Squawk
      test-package: PenguinKit
      sentry-project: squawk
      # Pushes to main ship to TestFlight; PRs only build.
      deploy: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      # Sentry: one shared auth token, one DSN per app (docs/telemetry.md).
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN_SQUAWK }}
