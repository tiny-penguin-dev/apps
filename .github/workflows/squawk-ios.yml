name: Squawk iOS

on:
  push:
    branches: [main]
    paths:
      - apps/squawk/ios/**
      - config/ios/**
      - scripts/ios/**
      - .github/workflows/ios-app.yml
      - .github/workflows/squawk-ios.yml
  pull_request:
    paths:
      - apps/squawk/ios/**
      - config/ios/**
      - scripts/ios/**
      - .github/workflows/ios-app.yml
      - .github/workflows/squawk-ios.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload to TestFlight
        type: boolean
        default: true

concurrency:
  group: squawk-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    uses: ./.github/workflows/ios-app.yml
    with:
      app-dir: apps/squawk/ios
      scheme: Squawk
      test-package: PenguinKit
      # Pushes to main ship to TestFlight; PRs only build.
      deploy: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    secrets: inherit
