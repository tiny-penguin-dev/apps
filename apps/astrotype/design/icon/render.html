<!doctype html>
<!--
  The app icon and the keyboard's grey Astrotype mark, drawn on a canvas so each orbit
  can fade along its length (Gabriel, 9 Nov 2026). `render.mjs` opens this page once per
  image and saves the canvas. Open it in a browser to see all of them.

  ?v=light | dark | tinted   a 1024 px app icon appearance
  ?v=mark&w=30&s=3           the mark, w points wide at scale s, black on clear
-->
<html><head><meta charset="utf-8"><title>Astrotype icon</title>
<style>body{margin:0;background:#1c1c1e;display:flex;flex-wrap:wrap;gap:16px;padding:16px}canvas{max-width:300px}</style>
</head><body><script>
const C = [512, 520];

// Each orbit is a trail that ends at its dot: bright at the dot and fading back round
// the ellipse until it reaches the dot again from behind. The first (teal) runs
// right to left along its front half into a dot on the left; the second (coral) left
// to right into a dot on the right, and passes over the first where they cross.
function orbits(rx, ry, colors) {
  return [
    { tilt: -28, head: Math.PI + 0.31, dir: 1, color: colors[0], rx, ry },
    { tilt: 28, head: 0.35, dir: -1, color: colors[1], rx, ry },
  ];
}
function pt(o, th) {
  const x = o.rx * Math.cos(th), y = o.ry * Math.sin(th), a = o.tilt * Math.PI / 180;
  return [C[0] + x * Math.cos(a) - y * Math.sin(a), C[1] + x * Math.sin(a) + y * Math.cos(a)];
}
// Points from the dot backwards, all the way round; t is 0 at the dot and 1 back at it.
function trail(o, n = 360) {
  const p = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, th = o.head - o.dir * t * 2 * Math.PI;
    p.push({ t, xy: pt(o, th), front: Math.sin(th) > 0 });
  }
  return p;
}
// Runs of consecutive points in front of (or behind) the key.
function runs(o, front) {
  const out = []; let cur = [], prev = null;
  for (const q of trail(o)) {
    if (q.front === front) { if (!cur.length && prev) cur.push(prev); cur.push(q); } else { if (cur.length) { cur.push(q); out.push(cur); } cur = []; }
    prev = q;
  }
  if (cur.length) out.push(cur);
  return out;
}
// Draws a whole orbit with its fade in one stroke (so no seams where it goes behind the
// key and comes out again): a conic gradient round the centre, whose stops follow the
// trail (the angle round the centre only grows along an ellipse). It is drawn on its
// own layer, and the part behind the key (the key's area on the back half's side of
// the orbit's long axis) is rubbed out before the layer goes on.
function drawOrbit(ctx, o, alpha, rgb, width, { inset = 0, under = null } = {}) {
  const pts = trail(o);
  const angle = q => Math.atan2(q.xy[1] - C[1], q.xy[0] - C[0]);
  const start = angle(pts[0]);
  const layer = document.createElement('canvas');
  layer.width = ctx.canvas.width; layer.height = ctx.canvas.height;
  const l = layer.getContext('2d');
  l.setTransform(ctx.getTransform());
  const g = l.createConicGradient(start, C[0], C[1]);
  // Both the gradient and atan2 go clockwise on screen, so each point's place is just
  // its angle past the dot's.
  const stops = pts.map(q => {
    let d = angle(q) - start;
    d = ((d % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    return [q.t === 1 ? 1 : d / (2 * Math.PI), alpha(q.t)];
  });
  stops.sort((a, b) => a[0] - b[0]);
  for (const [at, a] of stops) g.addColorStop(Math.min(1, Math.max(0, at)), `rgba(${rgb},${a})`);
  l.strokeStyle = g; l.lineWidth = width; l.lineCap = 'butt'; l.lineJoin = 'round';
  l.beginPath(); l.moveTo(...pts[0].xy);
  for (const q of pts.slice(1)) l.lineTo(...q.xy);
  l.stroke();
  // Behind the key: the half-plane on the back half's side of the long axis, inside the key.
  const a = o.tilt * Math.PI / 180, nx = -Math.sin(a), ny = Math.cos(a), ux = Math.cos(a), uy = Math.sin(a), far = 2000;
  l.save();
  l.beginPath();
  l.moveTo(C[0] - ux * far, C[1] - uy * far); l.lineTo(C[0] + ux * far, C[1] + uy * far);
  l.lineTo(C[0] + ux * far - nx * far, C[1] + uy * far - ny * far); l.lineTo(C[0] - ux * far - nx * far, C[1] - uy * far - ny * far);
  l.closePath(); l.clip();
  l.globalCompositeOperation = 'destination-out';
  // Inset a little for the grey mark, so the ring tucks under the key's edge with no
  // seam (the key is the same colour there).
  l.beginPath(); l.roundRect(292 + inset, 292 + inset, 440 - 2 * inset, 440 - 2 * inset, 92 - inset); l.fill();
  // Its back half also goes under the front half of an orbit drawn before it.
  if (under) { l.beginPath(); strokeOutline(l, under, width + 6); l.fill(); }
  l.restore();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(layer, 0, 0); ctx.restore();
}
function frontPath(ctx, o) {
  ctx.beginPath();
  for (const run of runs(o, true)) { ctx.moveTo(...run[0].xy); for (const q of run.slice(1)) ctx.lineTo(...q.xy); }
}
// Adds the outline of an orbit's front half, `width` wide, to the current path.
function strokeOutline(ctx, o, width) {
  const run = runs(o, true).sort((a, b) => b.length - a.length)[0];
  const left = [], right = [];
  run.forEach((q, i) => {
    const a = run[Math.max(0, i - 1)].xy, b = run[Math.min(run.length - 1, i + 1)].xy;
    const l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const nx = -(b[1] - a[1]) / l * width / 2, ny = (b[0] - a[0]) / l * width / 2;
    left.push([q.xy[0] + nx, q.xy[1] + ny]); right.push([q.xy[0] - nx, q.xy[1] - ny]);
  });
  ctx.moveTo(...left[0]);
  for (const p of left) ctx.lineTo(...p);
  for (const p of right.reverse()) ctx.lineTo(...p);
  ctx.closePath();
}
function key(ctx, y = 292) { ctx.beginPath(); ctx.roundRect(292, y, 440, 440, 92); }
function letterA(ctx) {
  ctx.beginPath();
  ctx.moveTo(412.16, 644); ctx.lineTo(512, 388); ctx.lineTo(611.84, 644);
  ctx.moveTo(452.1, 551.84); ctx.lineTo(571.9, 551.84);
}
const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(',');

// The icon: solid in front of the key, fading behind it, a faint end back at the dot.
const iconFade = t => t < 0.45 ? 1 : Math.max(0.12, 1 - 0.88 * Math.pow((t - 0.45) / 0.55, 0.9));
const APPEARANCES = {
  light: { bg: ['#2E4376', '#17213F'], stars: 'rgba(255,255,255,.55)', orbits: ['#2FC6DC', '#FF8A9E'],
           shade: '#C9D6DE', blur: true, key: '#FFFFFF', ink: '#1E2945' },
  dark: { bg: ['#1C2A4A', '#0E1526'], stars: 'rgba(255,255,255,.55)', orbits: ['#2FC6DC', '#FF8A9E'],
          shade: '#B9C7D1', blur: true, key: '#F4F8FA', ink: '#1E2945' },
  tinted: { bg: null, stars: 'rgba(221,221,221,.5)', orbits: ['#F0F0F0', '#C0C0C0'],
            shade: '#555555', blur: false, key: '#8A8A8A', ink: '#F4F4F4' },
};
function drawIcon(cv, look) {
  const ctx = cv.getContext('2d'), a = APPEARANCES[look];
  ctx.scale(cv.width / 1024, cv.width / 1024);
  if (a.bg) {
    const bg = ctx.createLinearGradient(0, 0, 0, 1024);
    bg.addColorStop(0, a.bg[0]); bg.addColorStop(1, a.bg[1]);
    ctx.fillStyle = bg; ctx.fillRect(0, 0, 1024, 1024);
  }
  ctx.fillStyle = a.stars;
  for (const [x, y, r] of [[150, 170, 9], [880, 140, 7], [820, 860, 8], [140, 840, 6], [520, 96, 5], [940, 520, 5], [90, 520, 6], [700, 940, 5]]) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill();
  }
  const os = orbits(432, 152, a.orbits);
  ctx.save();
  if (a.blur) { ctx.shadowColor = 'rgba(11,42,58,.22)'; ctx.shadowBlur = 44; ctx.shadowOffsetY = 22; }
  ctx.fillStyle = a.shade; key(ctx, 306); ctx.fill();
  ctx.restore();
  ctx.fillStyle = a.key; key(ctx); ctx.fill();
  ctx.strokeStyle = a.ink; ctx.lineWidth = 66; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; letterA(ctx); ctx.stroke();
  os.forEach((o, i) => drawOrbit(ctx, o, iconFade, rgb(o.color), 38, { under: i > 0 ? os[0] : null }));
  for (const o of os) { const [x, y] = pt(o, o.head); ctx.fillStyle = o.color; ctx.beginPath(); ctx.arc(x, y, 43.7, 0, 2 * Math.PI); ctx.fill(); }
}

// The grey mark: one colour (the keyboard tints it), so the depth comes from gaps: the
// "A" and a thin gap round each front half are cut out of the key, and the second ring
// cuts a gap in the first where it passes over it. Tighter, so it's less wide.
const MARK_BOX = [140, 268, 744, 504];
const markFade = t => Math.max(0.1, 1 - 0.9 * Math.pow(t, 1.3));
function drawMark(cv) {
  const ctx = cv.getContext('2d'), w = 36, gap = 18, dot = 44;
  ctx.scale(cv.width / MARK_BOX[2], cv.width / MARK_BOX[2]);
  ctx.translate(-MARK_BOX[0], -MARK_BOX[1]);
  const os = orbits(360, 130, ['#000000', '#000000']);
  ctx.fillStyle = '#000'; key(ctx); ctx.fill();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = 'destination-out';
  ctx.lineWidth = 66; letterA(ctx); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  os.forEach((o, i) => {
    // The gap only cuts the key and, for the second ring, the first one where they
    // cross; the back halves stay whole.
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    key(ctx);
    if (i > 0) strokeOutline(ctx, os[0], w + 2 * gap);
    ctx.clip();
    ctx.lineWidth = w + 2 * gap; frontPath(ctx, o); ctx.stroke();
    ctx.restore();
    drawOrbit(ctx, o, markFade, '0,0,0', w, { inset: 4, under: i > 0 ? os[0] : null });
  });
  for (const o of os) {
    const [x, y] = pt(o, o.head);
    ctx.save(); ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(x, y, dot + gap, 0, 2 * Math.PI); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x, y, dot, 0, 2 * Math.PI); ctx.fill();
  }
}

const q = new URLSearchParams(location.search);
function make(v, scale = 1, width = 30) {
  const cv = document.createElement('canvas');
  if (v === 'mark') { cv.width = Math.round(width * scale); cv.height = Math.round(width * MARK_BOX[3] / MARK_BOX[2] * scale); drawMark(cv); }
  else { cv.width = cv.height = 1024; drawIcon(cv, v); }
  cv.id = 'out'; document.body.appendChild(cv);
  return cv;
}
if (q.get('v')) make(q.get('v'), +(q.get('s') || 1), +(q.get('w') || 30));
else { for (const v of ['light', 'dark', 'tinted']) make(v); const m = make('mark', 10); m.style.background = '#999'; }
</script></body></html>
