<title>Astrotype Emoji Search</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: one phone on a pale ice stage with a screen picker beside it, like design/mockups/astrotype.html. Same tokens and keyboard classes; the emoji page adds .epage, .ecell, .estrip and .tones. */
:root{
  --stage:#E6F0F4; --bg:#F3F8FA; --card:#FFFFFF; --ink:#1E2945; --muted:#67748F; --line:#DCE6EC;
  --accent:#139FB5; --accent-ink:#FFFFFF; --left:#139FB5; --right:#FF6F86; --sun:#FFC24D; --mint:#2FBF96; --ice:#D9EDF3;
  --key:#FFFFFF; --key-ink:#1E2945; --key-dark:#C9D6DE; --kb:#DCE6EC;
  --font:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r-md:18px; --r-sm:12px;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#0A1118; --bg:#111A24; --card:#1A2634; --ink:#EEF4F8; --muted:#97A6B8; --line:#2A3B4C;
  --accent:#2FC6DC; --accent-ink:#06202A; --left:#2FC6DC; --right:#FF8A9E; --sun:#FFCD66; --mint:#45D3AA; --ice:#1D3240;
  --key:#2A3A4A; --key-ink:#EEF4F8; --key-dark:#1C2834; --kb:#131E29; color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#0A1118; --bg:#111A24; --card:#1A2634; --ink:#EEF4F8; --muted:#97A6B8; --line:#2A3B4C;
  --accent:#2FC6DC; --accent-ink:#06202A; --left:#2FC6DC; --right:#FF8A9E; --sun:#FFCD66; --mint:#45D3AA; --ice:#1D3240;
  --key:#2A3A4A; --key-ink:#EEF4F8; --key-dark:#1C2834; --kb:#131E29; color-scheme:dark}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding-block:24px;flex-wrap:wrap}
.picker{display:flex;flex-direction:column;gap:6px;max-width:240px;min-width:0}
.picker h1{font-size:28px;font-weight:900;margin:0}
.picker p{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.45}
.picker button{font:inherit;font-weight:700;font-size:14px;text-align:left;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:10px;cursor:pointer}
.picker button[aria-current="true"]{background:var(--card);color:var(--ink)}
.picker button:focus-visible,.phone button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.picker small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;margin-top:10px;padding-left:12px}
.themes,.sizes{display:flex;gap:4px;margin-top:8px}
.themes button,.sizes button{padding:5px 10px;font-size:12px;background:var(--line)}
.themes button[aria-pressed="true"],.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.phone{width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:48px;position:relative;overflow:hidden;
  box-shadow:0 0 0 10px var(--ink),0 30px 60px rgba(20,30,60,.25);flex:none;touch-action:manipulation}
.phone.small{width:420px;height:700px;border-radius:40px}
.phone.wide{width:744px;height:1024px;border-radius:40px}
@media (max-width:700px){.picker{max-width:100%;flex-direction:row;flex-wrap:wrap}.picker h1,.picker p{width:100%}.picker small{display:none}
  .phone,.phone.small{box-shadow:none;border-radius:32px;height:820px}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:58px 22px 0;gap:8px}
.phone.wide .screen{padding-left:40px;padding-right:40px}
.status{position:absolute;top:14px;left:30px;right:30px;display:flex;justify-content:space-between;font-weight:800;font-size:15px;z-index:3}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;padding:6px 10px;border-radius:999px;background:var(--ice);color:var(--ink);align-self:center}
.convo{display:flex;flex-direction:column;gap:8px;flex:1;overflow:hidden}
.bub{max-width:78%;padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.35;background:var(--card)}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.compose{display:flex;gap:8px;align-items:flex-end;margin:0 -22px;padding:8px 14px;background:var(--bg)}
.phone.wide .compose,.phone.wide .kbwrap{margin-left:-40px;margin-right:-40px}
.field{flex:1;min-height:44px;padding:9px 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:17px;line-height:1.4;word-break:break-word}
.field .caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:text-bottom;animation:blink 1s steps(1) infinite;margin-left:1px}
.field .e{font-family:var(--emoji)}
@keyframes blink{50%{opacity:0}}
.send{font:inherit;font-weight:900;border:0;border-radius:50%;width:44px;height:44px;background:var(--accent);color:var(--accent-ink);flex:none}

/* keyboard (same classes as the app mockup) */
.kbwrap{margin:0 -22px;position:relative;background:var(--kb);padding:8px 4px 0;user-select:none;-webkit-user-select:none}
.bar{display:flex;align-items:center;height:44px;padding:0 6px;margin-bottom:8px}
.bar .note{flex:1;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.rows{display:flex;flex-direction:column;gap:9px}
.krow{display:flex;justify-content:center;gap:6px}
.key{flex:1 1 0;min-width:0;max-width:33px;height:44px;border-radius:7px;background:var(--key);color:var(--key-ink);font:inherit;font-weight:700;font-size:21px;border:0;padding:0;display:grid;place-items:center;
  box-shadow:0 1px 0 rgba(0,0,0,.25);position:relative;cursor:pointer;transition:background .15s,transform .15s var(--spring)}
.key:active{background:var(--left);color:#fff}
.key.wide{flex:1.45 1 0;max-width:48px;background:var(--key-dark);font-size:15px}
.key.space{flex:5.7 1 0;max-width:190px;font-size:13px;font-weight:800;color:var(--muted)}
.key.fn{flex:1.33 1 0;max-width:44px;background:var(--key-dark);font-size:14px}
.key.ret{flex:2.66 1 0;max-width:88px;background:var(--key-dark);font-size:14px}
.key.new{box-shadow:0 0 0 3px var(--sun)}
.key svg{width:22px;height:22px}
.phone.wide .kbwrap{padding-left:16px;padding-right:16px}
.phone.wide .krow{gap:8px}
.phone.wide .key{max-width:58px;height:54px;font-size:24px}
.phone.wide .key.wide{max-width:84px}.phone.wide .key.fn{max-width:76px}.phone.wide .key.ret{max-width:150px}.phone.wide .key.space{max-width:330px}
.phone.small .key{max-width:37px}
.phone.small .key.wide{max-width:54px}.phone.small .key.fn{max-width:50px}.phone.small .key.ret{max-width:100px}.phone.small .key.space{max-width:214px}

/* the strip iOS draws under the keyboard on Face ID phones: its own globe and dictation */
.sys{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;color:var(--muted)}
.sys span{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.04em}
.sys svg{width:24px;height:24px}
.homebtn{height:16px}

/* emoji page: takes the bar and the keys' room together */
.epage{display:flex;flex-direction:column;height:var(--kbh);margin-top:-8px}
.escroll{flex:1;display:flex;gap:28px;overflow-x:auto;overflow-y:hidden;padding:6px 10px 0;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain}
.escroll::-webkit-scrollbar{display:none}
.esec{display:flex;flex-direction:column;gap:2px;flex:none}
.egrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,var(--cell));grid-auto-columns:var(--cell)}
/* search: a pill over the grid; tapping it turns the page into letters with a field and one row of results */
.esec h3.old{margin:0;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);height:18px;line-height:18px;padding-left:4px;white-space:nowrap}
.epage.old .esec{flex-direction:row;gap:8px}.epage.old .egrid{grid-template-rows:repeat(5,var(--cell))}
.spill{display:flex;align-items:center;gap:8px;height:36px;margin:2px 8px 4px;padding:0 12px;border-radius:12px;background:var(--key);color:var(--muted);font:inherit;font-weight:700;font-size:15px;border:0;cursor:text;text-align:left;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.spill svg{width:18px;height:18px;flex:none}
.spill .q{flex:1;color:var(--ink);white-space:nowrap;overflow:hidden}
.spill .q:empty::before{content:"Search emoji";color:var(--muted)}
.spill .q.on::after{content:"";display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:text-bottom;margin-left:1px;animation:blink 1s steps(1) infinite}
.spill .x{border:0;background:var(--key-dark);color:var(--key-ink);width:20px;height:20px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:12px;font-weight:900;cursor:pointer;flex:none}
.sres{display:flex;align-items:center;gap:2px;height:44px;margin-bottom:8px;padding:0 6px;overflow-x:auto;scrollbar-width:none}
.sres::-webkit-scrollbar{display:none}
.sres .ecell{width:40px;height:40px;flex:none;font-size:29px}
.sres .none{flex:1;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.key.on{background:var(--ice)}
.ecell{font-family:var(--emoji);font-size:calc(var(--cell) * .74);line-height:1;border:0;background:transparent;padding:0;border-radius:10px;cursor:pointer;display:grid;place-items:center;position:relative;-webkit-touch-callout:none}
.ecell:active{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.ecell.pop{animation:pop .25s var(--spring)}
@keyframes pop{50%{transform:scale(1.3)}}
.estrip{display:flex;align-items:center;gap:2px;height:44px;padding:0 4px}
.estrip .key{flex:none;width:52px;max-width:none;height:36px;font-size:14px}
.cats{flex:1;display:flex;justify-content:space-around;min-width:0}
.cat{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:50%;padding:0;display:grid;place-items:center;cursor:pointer;flex:none}
.cat svg{width:19px;height:19px}
.cat[aria-current="true"]{background:var(--key-dark);color:var(--ink)}
:root[data-theme="dark"] .cat[aria-current="true"]{background:var(--key)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cat[aria-current="true"]{background:var(--key)}}
.tones{position:absolute;z-index:5;display:flex;gap:2px;padding:6px;border-radius:16px;background:var(--key);box-shadow:0 8px 24px rgba(20,30,60,.28);animation:rise .2s var(--spring)}
.tones .ecell{width:44px;height:44px;font-size:32px}
.tones .ecell[aria-pressed="true"]{background:var(--ice)}
.tones hr{width:1px;border:0;background:var(--line);margin:4px 2px}
@keyframes rise{from{transform:translateY(8px) scale(.9);opacity:0}}
.flash{flex:1;text-align:center;color:var(--ink);font-weight:800;font-size:14px}
.callout{flex:none;border:1.5px dashed var(--line);border-radius:var(--r-md);padding:10px 14px;font-size:13px;line-height:1.45;color:var(--muted)}
.callout b{color:var(--ink)}
.phone.wide .callout{max-width:460px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<div class="stage">
  <nav class="picker" aria-label="Screens">
    <h1>Emoji search</h1>
    <p>Tap "Search emoji", type or swipe a word, tap an emoji to type it. The smiley key goes back to the page. The callouts say what changed.</p>
    <small>Before</small>
    <button data-go="before">Emoji page today</button>
    <small>After</small>
    <button data-go="emoji">1 · Emoji page with search</button>
    <button data-go="search">2 · Searching</button>
    <button data-go="found">3 · Results for "heart"</button>
    <button data-go="none">4 · Nothing found</button>
    <small>Size</small>
    <div class="sizes" role="group" aria-label="Size">
      <button data-size="small">Small</button><button data-size="">Phone</button><button data-size="wide">Wide</button>
    </div>
    <small>Theme</small>
    <div class="themes" role="group" aria-label="Theme">
      <button data-theme="">System</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button>
    </div>
  </nav>
  <div class="phone" id="phone" role="region" aria-label="Astrotype emoji mockup"></div>
</div>

let K={};
function kb(o){K=o;return `<div class="kbwrap" id="kb">${o.page==="emoji"?emojiPage():o.page==="search"?searchPage():letters()}${o.sys?`<div class="sys" aria-hidden="true"><span>${I.globe}</span><span>${I.mic}</span></div>`:`<div class="homebtn"></div>`}</div>`}
function letters(){
  const r=s=>[...s].map(k=>`<button class="key" data-k="${k}">${k}</button>`).join("");
  return `<div class="bar" id="bar"><div class="note">Both thumbs, one word</div></div><div class="rows">
    <div class="krow">${r("qwertyuiop")}</div><div class="krow">${r("asdfghjkl")}</div>
    <div class="krow"><button class="key wide" data-k="shift" aria-label="Shift">⇧</button>${r("zxcvbnm")}<button class="key wide" data-k="bs" aria-label="Delete">${I.bs}</button></div>
    <div class="krow"><button class="key fn" data-k="123">123</button>${K.globe?`<button class="key fn" data-k="globe" aria-label="Next keyboard">${I.globe}</button>`:""}${K.emoji?`<button class="key fn ${S.page!=="seen"?"new":""}" data-k="emoji" aria-label="Emoji">${I.smiley}</button>`:""}<button class="key space" data-k="space">Astrotype</button><button class="key ret" data-k="return">return</button></div></div>`;
}
function cell(e){const t=TONED.has(e)?S.tone[base(e)]||"":"";const shown=toned(e,t);
  return `<button class="ecell" data-e="${e}" aria-label="${shown}">${shown}</button>`}
function emojiPage(){
  const old=K.old;
  const secs=CATS.map(([id,name,list])=>{const items=id==="recent"?S.recent:list.split(" ");
    return `<section class="esec" data-cat="${id}">${old?`<h3 class="old">${name}</h3>`:""}<div class="egrid">${items.map(cell).join("")}</div></section>`}).join("");
  return `<div class="epage${old?" old":""}">${old?"":`<button class="spill" data-k="search">${I.search}<span class="q"></span></button>`}<div class="escroll" id="escroll">${secs}</div>
    <div class="estrip"><button class="key fn" data-k="abc">ABC</button>
      <div class="cats">${CATS.map(([id,name])=>`<button class="cat" data-cat="${id}" aria-label="${name}">${I[id]}</button>`).join("")}</div>
      <button class="key fn" data-k="bs" aria-label="Delete">${I.bs}</button></div></div>`;
}

/* search: word prefixes of the name first, then of the keywords; the app ranks by your use too */
function find(q){q=q.trim().toLowerCase();if(!q)return S.recent;const words=q.split(/\s+/);const all=CATS.slice(1).flatMap(c=>c[2].split(" "));
  const scored=[];for(const e of new Set(all)){const n=NAMES[e];if(!n)continue;const [name,kw]=n.split("|");const nw=name.toLowerCase().split(/[\s:,-]+/),kws=(kw||"").toLowerCase().split(" | ");
    let score=0;for(const w of words){let s=0;if(nw.some(x=>x.startsWith(w)))s=nw[0].startsWith(w)?3:2;else if(kws.some(k=>k.split(" ").some(x=>x.startsWith(w))))s=1;if(!s){score=0;break}score+=s}
    if(score)scored.push([score+(S.recent.includes(e)?.5:0),e])}
  return scored.sort((a,b)=>b[0]-a[0]).map(x=>x[1]).slice(0,40)}
function searchPage(){const res=find(S.q);
  const r=s=>[...s].map(k=>`<button class="key" data-k="${k}">${k}</button>`).join("");
  return `<div class="spill" role="search" aria-label="Search emoji">${I.search}<span class="q on">${esc(S.q)}</span>${S.q?`<button class="x" aria-label="Clear">×</button>`:""}</div>
  <div class="sres" id="sres" aria-label="Results">${res.length?res.map(cell).join(""):`<div class="none">No emoji for “${esc(S.q)}”</div>`}</div>
  <div class="rows"><div class="krow">${r("qwertyuiop")}</div><div class="krow">${r("asdfghjkl")}</div>
    <div class="krow"><button class="key wide" data-k="shift" aria-label="Shift">⇧</button>${r("zxcvbnm")}<button class="key wide" data-k="bs" aria-label="Delete">${I.bs}</button></div>
    <div class="krow"><button class="key fn" data-k="abc">ABC</button><button class="key fn on" data-k="emoji" aria-label="Back to emoji">${I.smiley}</button><button class="key space" data-k="space">space</button><button class="key ret" data-k="emoji">done</button></div></div>`}
/* ---------- behaviour ---------- */
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function renderField(){const f=document.getElementById("field");if(!f)return;
  f.innerHTML=[...new Intl.Segmenter().segment(S.text)].map(({segment:g})=>/\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(g)?`<span class="e">${g}</span>`:esc(g)).join("")+`<span class="caret"></span>`}
function del(){const segs=[...new Intl.Segmenter().segment(S.text)];segs.pop();S.text=segs.map(s=>s.segment).join("");renderField()}
function flash(msg){const b=document.getElementById("bar");if(!b)return;b.innerHTML=`<div class="flash">${msg}</div>`;clearTimeout(flash.t);flash.t=setTimeout(()=>{const b2=document.getElementById("bar");if(b2)b2.innerHTML=`<div class="note">Both thumbs, one word</div>`},1600)}
function setPage(p){S.page="seen";K.page=p;const w=document.getElementById("kb");w.outerHTML=kb(K);sizeKB(p);wire()}
function sizeKB(){const w=document.getElementById("kb");if(!w)return;
  /* the emoji page takes exactly the room of the bar and the keys */
  const wide=phone.classList.contains("wide");const keyH=wide?54:44,gap=9;
  const h=44+8+4*keyH+3*gap;w.style.setProperty("--kbh",h+"px");
  const cell=K.old?Math.floor((h-6-20-44)/5):Math.floor((h-6-42-44)/4);w.style.setProperty("--cell",Math.min(cell,wide?46:37)+"px")}
function insertEmoji(e,el){S.text+=e;renderField();
  if(el&&!matchMedia("(prefers-reduced-motion: reduce)").matches){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
  /* frequently used updates in the data now, but the grid only redraws next time the page opens, so nothing moves under the thumb */
  S.recent=[e,...S.recent.filter(x=>x!==e)].slice(0,30)}
function showTones(el){closeTones();const e=el.dataset.e;const cur=S.tone[base(e)]||"";
  const pop=document.createElement("div");pop.className="tones";pop.setAttribute("role","group");pop.setAttribute("aria-label","Skin tones");
  pop.innerHTML=TONES.map((t,i)=>`${i===1?"<hr>":""}<button class="ecell" data-tone="${t}" aria-pressed="${t===cur}" aria-label="${toned(e,t)}">${toned(e,t)}</button>`).join("");
  const w=document.getElementById("kb");w.appendChild(pop);
  const r=el.getBoundingClientRect(),wr=w.getBoundingClientRect();
  const left=Math.max(6,Math.min(wr.width-pop.offsetWidth-6,r.left-wr.left+r.width/2-pop.offsetWidth/2));
  pop.style.left=left+"px";pop.style.top=Math.max(-pop.offsetHeight-4,r.top-wr.top-pop.offsetHeight-6)+"px";
  pop.onclick=ev=>{const b=ev.target.closest("[data-tone]");if(!b)return;const t=b.dataset.tone;
    if(t)S.tone[base(e)]=t;else delete S.tone[base(e)];
    el.textContent=toned(e,t);el.setAttribute("aria-label",toned(e,t));insertEmoji(toned(e,t),el);closeTones();ev.stopPropagation()}}
function closeTones(){document.querySelectorAll(".tones").forEach(p=>p.remove())}
function wire(){
  const w=document.getElementById("kb");if(!w)return;
  w.querySelectorAll(".key,.spill[data-k]").forEach(k=>k.onclick=()=>{const c=k.dataset.k;closeTones();
    if(c==="emoji"){S.q="";return setPage("emoji")}
    if(c==="search")return setPage("search");
    if(c==="noop")return;
    if(K.page==="search"){if(c==="clear")S.q="";else if(c==="bs")S.q=S.q.slice(0,-1);else if(c==="space")S.q+=" ";else if(c==="abc"){S.q="";return setPage("letters")}else if(c.length===1)S.q+=c;return setPage("search")}
    if(c==="abc")return setPage("letters");
    if(c==="bs")return del();
    if(c==="space"){S.text+=" ";return renderField()}
    if(c==="return"||c==="shift")return;
    if(c==="123")return flash("Numbers page, unchanged");
    if(c==="globe")return flash("Next keyboard (Apple's, or another you added)");
    S.text+=c;renderField()});
  w.querySelectorAll(".x").forEach(x=>x.onclick=ev=>{ev.stopPropagation();S.q="";setPage("search")});
  const sr=document.getElementById("sres");if(sr)sr.onclick=ev=>{const el=ev.target.closest(".ecell");if(el)insertEmoji(el.textContent,el)};
  const sc=document.getElementById("escroll");if(!sc)return;
  let hold=null,held=false;
  sc.addEventListener("pointerdown",ev=>{const el=ev.target.closest(".ecell");held=false;if(!el||!TONED.has(el.dataset.e))return;
    hold=setTimeout(()=>{held=true;showTones(el)},450)});
  ["pointerup","pointercancel","pointerleave"].forEach(t=>sc.addEventListener(t,()=>clearTimeout(hold)));
  sc.addEventListener("scroll",()=>{clearTimeout(hold);markCat()},{passive:true});
  sc.addEventListener("contextmenu",ev=>ev.preventDefault());
  sc.addEventListener("click",ev=>{const el=ev.target.closest(".ecell");if(!el)return;if(held){held=false;return}closeTones();insertEmoji(el.textContent,el)});
  w.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{closeTones();const s=sc.querySelector(`.esec[data-cat="${b.dataset.cat}"]`);sc.scrollLeft=s.offsetLeft-sc.offsetLeft-10;markCat(b.dataset.cat)});
  markCat();
}
function markCat(force){const sc=document.getElementById("escroll");if(!sc)return;let cur=force;
  if(!cur){const x=sc.scrollLeft+sc.offsetLeft+40;cur="recent";sc.querySelectorAll(".esec").forEach(s=>{if(s.offsetLeft<=x)cur=s.dataset.cat})}
  document.querySelectorAll(".cat").forEach(b=>b.setAttribute("aria-current",b.dataset.cat===cur))}

/* ---------- navigation ---------- */
function go(name,push=true){
  if(!screens[name])name="letters";
  if(name==="today"||name==="letters"||name==="home")S.page="letters";
  S.q={search:"",found:"heart",none:"zzz"}[name]??"";
  phone.innerHTML=screens[name]();sizeKB();renderField();wire();
  picker.querySelectorAll("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===name));
  if(name==="tones"){const sc=document.getElementById("escroll");const el=sc.querySelector('.esec[data-cat="people"] .ecell[data-e="👍"]');
    sc.scrollLeft=el.offsetLeft-sc.offsetLeft-120;markCat();setTimeout(()=>showTones(el),50)}
  if(push)try{history.replaceState(null,"",location.pathname+location.search+"#"+name)}catch(e){}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)go(b.dataset.go)});
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".tones,.ecell"))closeTones()});
document.querySelectorAll(".themes button").forEach(b=>b.onclick=()=>{const t=b.dataset.theme;if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");document.querySelectorAll(".themes button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
document.querySelector('.themes button[data-theme=""]').setAttribute("aria-pressed","true");
document.querySelectorAll(".sizes button").forEach(b=>b.onclick=()=>{phone.className="phone "+b.dataset.size;document.querySelectorAll(".sizes button").forEach(x=>x.setAttribute("aria-pressed",x===b));go(location.hash.slice(1)||"emoji",false)});
document.querySelector('.sizes button[data-size=""]').setAttribute("aria-pressed","true");
window.addEventListener("hashchange",()=>go(location.hash.slice(1),false));
go((location.hash||"#emoji").slice(1),false);
</script>
