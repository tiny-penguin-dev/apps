<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astrotype Fix Earlier Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* One phone on a pale ice stage with a screen picker beside it. Tokens and components are Astrotype's (DESIGN.md "Design system"), copied from the word-control mockup. Reused: the bar's Fix state, WordMenu, UndoNote, the Not it? field. New: the EarlierTag (a small "Fixing" label over the bar's pill) and the field's own selection, drawn by iOS, not us. */
:root{
  --stage:#E6F0F4; --bg:#F3F8FA; --card:#FFFFFF; --ink:#1E2945; --muted:#67748F; --line:#DCE6EC;
  --accent:#139FB5; --accent-ink:#FFFFFF; --left:#139FB5; --right:#FF6F86; --sun:#FFC24D; --mint:#2FBF96; --ice:#D9EDF3;
  --key:#FFFFFF; --key-ink:#1E2945; --key-dark:#C9D6DE; --kb:#DCE6EC; --danger:#E0526A;
  --font:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#0A1118; --bg:#111A24; --card:#1A2634; --ink:#EEF4F8; --muted:#97A6B8; --line:#2A3B4C;
  --accent:#2FC6DC; --accent-ink:#06202A; --left:#2FC6DC; --right:#FF8A9E; --sun:#FFCD66; --mint:#45D3AA; --ice:#1D3240;
  --key:#2A3A4A; --key-ink:#EEF4F8; --key-dark:#1C2834; --kb:#131E29; --danger:#FF7A8E; color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#0A1118; --bg:#111A24; --card:#1A2634; --ink:#EEF4F8; --muted:#97A6B8; --line:#2A3B4C;
  --accent:#2FC6DC; --accent-ink:#06202A; --left:#2FC6DC; --right:#FF8A9E; --sun:#FFCD66; --mint:#45D3AA; --ice:#1D3240;
  --key:#2A3A4A; --key-ink:#EEF4F8; --key-dark:#1C2834; --kb:#131E29; --danger:#FF7A8E; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding-block:24px;flex-wrap:wrap}
.picker{display:flex;flex-direction:column;gap:6px;max-width:250px;min-width:0}
.picker h1{font-size:28px;font-weight:900;margin:0}
.picker p{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.45}
.picker button{font-weight:700;font-size:14px;text-align:left;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:10px;cursor:pointer}
.picker button[aria-current="true"]{background:var(--card);color:var(--ink)}
.picker small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;margin-top:10px;padding-left:12px}
.picker button:focus-visible,.phone :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg-mini{display:flex;gap:4px;margin-top:4px;padding-left:8px;flex-wrap:wrap}
.seg-mini button{padding:5px 10px;font-size:12px;background:var(--line)}
.seg-mini button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.why{font-size:13px;color:var(--muted);line-height:1.45;background:var(--card);border-radius:12px;padding:10px 12px;margin-top:10px}
.phone{width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:48px;position:relative;overflow:hidden;
  box-shadow:0 0 0 10px var(--ink),0 30px 60px rgba(20,30,60,.25);flex:none}
.phone.small{width:320px;height:568px;border-radius:36px}
.phone.wide{width:744px;height:1024px;border-radius:40px}
@media (max-width:700px){.picker{max-width:100%;flex-direction:row;flex-wrap:wrap;align-items:center}.picker h1,.picker p,.why{width:100%}.picker small{display:none}
  .phone{box-shadow:none;border-radius:32px}.phone.wide{display:none}}
.status{position:absolute;top:14px;left:30px;right:30px;display:flex;justify-content:space-between;font-weight:800;font-size:15px;z-index:3}
.phone.small .status{top:8px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:54px 0 0}
.phone.small .screen{padding-top:34px}
.screen.anim{animation:in .4s var(--spring)}
@keyframes in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.nav{display:flex;align-items:center;padding:0 22px;height:40px;flex:none}
.back{font-weight:800;color:var(--accent);background:none;border:0;font-size:17px;padding:0;cursor:pointer}
.navx{display:flex;align-items:center;gap:14px;margin-left:auto}
.navx button{font-weight:800;color:var(--accent);background:none;border:0;font-size:17px;padding:0;cursor:pointer}
.navx .plus{font-size:26px;line-height:1;font-weight:700}
.scroll{overflow-y:auto;flex:1;padding:0 22px 40px;display:flex;flex-direction:column;gap:8px}
.phone.small .scroll{padding:0 14px 30px}
.phone.wide .scroll{padding:0 40px 40px}
.h1{font-size:30px;font-weight:900;line-height:1.1;margin:4px 0 6px;text-wrap:balance}
.phone.small .h1{font-size:26px}
.sub{color:var(--muted);font-size:13px;line-height:1.4;margin:0 0 4px}
.sec{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 0 6px}
.group{background:var(--card);border-radius:var(--r-md);overflow:hidden}
.group>.r+.r{border-top:1px solid var(--line)}
.foot{color:var(--muted);font-size:13px;line-height:1.4;margin:2px 6px 0}
.r{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:52px;width:100%;color:inherit;text-align:left;background:none;border:0}
button.r{cursor:pointer}
.r .t{flex:1;min-width:0}
.r .t b{display:block;font-size:16px;font-weight:800}
.r .t span{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:1px}
.r .val{color:var(--muted);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--muted);font-weight:900;font-size:18px;margin-left:-4px}
.r.danger .t b{color:var(--danger)}
.r.new{box-shadow:inset 4px 0 0 var(--sun)}
.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic.teal{background:var(--left)}.ic.coral{background:var(--right)}.ic.mint{background:var(--mint)}.ic.sun{background:var(--sun)}.ic.sun svg{stroke:#3A2600}.ic.navy{background:#5B6B8C}
.toggle{width:52px;height:32px;border-radius:999px;background:var(--mint);border:0;position:relative;flex:none;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:23px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.chip{display:inline-flex;align-items:center;font-weight:800;border-radius:999px;white-space:nowrap;padding:4px 9px;font-size:12px}
.chip.kept{background:color-mix(in srgb,var(--mint) 22%,transparent)}
.chip.mine{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.chip.more{background:color-mix(in srgb,var(--sun) 35%,transparent)}
.dots{display:flex;gap:4px;flex:none}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
.mini-btn{font-weight:800;font-size:14px;border:0;border-radius:999px;background:var(--ice);color:var(--ink);padding:6px 12px;cursor:pointer;flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:var(--r-sm);padding:9px 12px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.4;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:700;border:0;background:none;color:var(--ink);outline:none}
.search input::placeholder{color:var(--muted)}
.swipe{position:relative;overflow:hidden}
.swipe .under{position:absolute;inset:0;display:flex;justify-content:flex-end;align-items:stretch}
.swipe .under span{background:var(--mint);color:#fff;font-weight:800;display:grid;place-items:center;width:96px}
.swipe .r{background:var(--card);transform:translateX(-96px)}
.seg{display:flex;background:var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;font-weight:800;font-size:14px;border:0;background:transparent;color:var(--muted);padding:8px 0;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.empty{color:var(--muted);font-size:15px;text-align:center;padding:24px 10px}
.scrim{position:absolute;inset:0;background:rgba(10,17,24,.35);z-index:5;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px 22px 34px;display:flex;flex-direction:column;gap:12px;animation:up .35s var(--spring)}
@keyframes up{from{transform:translateY(40%)}}
.sheet .bar{display:flex;align-items:center;justify-content:space-between}.sheet .bar b{font-size:17px;font-weight:900}
.sheet .bar button{font-weight:800;font-size:17px;color:var(--accent);background:none;border:0;cursor:pointer}
.sheet .note{color:var(--muted);font-size:13px;line-height:1.4;margin:0 4px}
.phone.wide .scrim{align-items:center;justify-content:center}.phone.wide .sheet{width:420px;border-radius:var(--r-lg)}

/* Keyboard */
.thread{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px 22px;justify-content:flex-end;overflow:hidden}
.msg{max-width:78%;padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.35;background:var(--card)}
.compose{display:flex;gap:8px;padding:8px 14px}
.field{flex:1;min-height:40px;padding:9px 14px;border-radius:22px;border:1px solid var(--line);font-size:17px;background:var(--card)}
.field .sel{background:color-mix(in srgb,var(--accent) 28%,transparent);border-radius:3px}
.field .fixed{background:color-mix(in srgb,var(--mint) 30%,transparent);border-radius:3px;transition:background 1s}
.fingertap{display:inline-block;width:0;position:relative}
.fingertap::after{content:"";position:absolute;left:-14px;top:-6px;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--ink) 18%,transparent);animation:tap 1.4s ease-out infinite}
@keyframes tap{0%{transform:scale(.4);opacity:1}80%,100%{transform:scale(1.2);opacity:0}}
/* EarlierTag (new): says the bar is about an earlier word, not the one being typed */
.pillwrap{position:relative;display:inline-flex}
.tag{position:absolute;left:50%;top:-11px;transform:translateX(-50%);font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:999px;white-space:nowrap;pointer-events:none}
/* Not it? field, as features/missed-words */
.notit{display:flex;align-items:center;gap:8px;width:100%;min-width:0}
.notit .box{flex:1;min-width:0;background:var(--card);border-radius:16px;padding:7px 12px;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden}
.notit .box span{color:var(--muted);font-weight:700}
.notit .save{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:8px 14px;cursor:pointer}
.caret{display:inline-block;width:2px;height:20px;background:var(--accent);vertical-align:-4px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kb{background:var(--kb);padding:6px 4px 26px;flex:none}
.phone.small .kb{padding-bottom:6px}
.kbar{height:44px;margin-bottom:6px;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:4px;padding:0 4px;position:relative}
.kbar .center{display:flex;justify-content:center;align-items:center;gap:6px;min-width:0;height:100%}
.kbar.fresh .center{animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(6px);opacity:0}}
.g{font-weight:700;font-size:17px;border:0;background:transparent;color:var(--ink);padding:7px 10px;border-radius:16px;cursor:pointer;white-space:nowrap;
  transition:transform .25s var(--spring),background .15s}
.g.pill{background:var(--card);font-weight:900;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.g.alt{color:var(--muted)}
.g.held{background:var(--ice);transform:scale(1.08)}
.icon{width:40px;height:40px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* WordMenu (new): the bar while a guess is held */
.wm{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;min-width:0;width:100%}
.wm .side{display:flex;min-width:0}.wm .side.l{justify-content:flex-end}.wm .side.r{justify-content:flex-start}
.wm .word{border:0;cursor:pointer;color:var(--ink);font-weight:900;font-size:17px;padding:7px 10px;border-radius:16px;background:var(--card);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:3.5em;max-width:9em}
.act{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:999px;font-weight:800;font-size:14px;padding:8px 12px;cursor:pointer;white-space:nowrap;flex:none}
.act svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.act.never{background:var(--right);color:var(--accent-ink)}
.act.more{background:var(--mint);color:var(--accent-ink)}
.phone.small .act{padding:8px 9px;font-size:13px}
.act .short{display:none}
.phone.small .act .long,.wm.tight .act .long{display:none}.phone.small .act .short,.wm.tight .act .short{display:inline}
.phone.wide .wm.tight .act .long{display:inline}.phone.wide .wm.tight .act .short{display:none}
.wm.anim{animation:rise .2s ease-out}
/* UndoNote (new) */
.undo{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:15px;color:var(--ink);width:100%;animation:rise .2s ease-out}
.undo span{color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.undo button{border:0;background:var(--ice);border-radius:999px;padding:6px 12px;font-weight:800;color:var(--accent);cursor:pointer}
.keys{display:flex;flex-direction:column;gap:8px}
.krow{display:flex;justify-content:center;gap:5px}
.key{flex:1 1 0;max-width:34px;height:42px;border-radius:7px;background:var(--key);color:var(--key-ink);font-weight:700;font-size:20px;display:grid;place-items:center;box-shadow:0 1px 0 rgba(0,0,0,.25);border:0}
.phone.small .key{height:38px;font-size:18px}
.key.fn{background:var(--key-dark);font-size:14px;max-width:46px;flex:1.35 1 0}
.key.space{flex:5.5 1 0;max-width:190px;font-size:13px;color:var(--muted);font-weight:800}
.key.ret{flex:2.6 1 0;max-width:88px;background:var(--key-dark);font-size:14px}
.phone.wide .key{max-width:58px;height:54px;font-size:24px}.phone.wide .key.fn{max-width:76px}.phone.wide .key.space{max-width:330px}.phone.wide .key.ret{max-width:150px}
.hint{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;font-size:13px;padding:8px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}
.splitview{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
.splitview .side{border-right:1px solid var(--line)}
.splitview .scroll{padding:0 24px 40px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="picker" id="picker">
    <h1>Fix an earlier word</h1>
    <p>Spotted a wrong word after you've moved on? Tap into it or select it. The bar shows that word with its other readings, so you can swap it, type the right one, or tell the keyboard never to suggest it.</p>
    <small>Tap into the word</small>
    <button data-s="typed">1. The mistake, noticed late</button>
    <button data-s="tap">2. Tap into “cage”</button>
    <button data-s="swapped">3. Tap “cafe”: swapped</button>
    <small>Teach it</small>
    <button data-s="menu">4. Hold “cage”: the word menu</button>
    <button data-s="blocked">5. After Never suggest</button>
    <button data-s="typeit">6. Not in the list: type it</button>
    <small>Select it</small>
    <button data-s="select">7. Select the word</button>
    <button data-s="typing">8. Typing a key instead</button>
    <small>Look</small>
    <div class="seg-mini" id="size">
      <button data-size="small">Small</button><button data-size="" aria-pressed="true">Phone</button><button data-size="wide">Wide</button>
    </div>
    <div class="seg-mini" id="theme">
      <button data-theme="light">Light</button><button data-theme="dark">Dark</button><button data-theme="" aria-pressed="true">Auto</button>
    </div>
    <div class="why" id="why"></div>
  </div>
  <div class="phone" id="phone"></div>
</div>
<script>
const ICON = {
  close:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  globe:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
  pencil:'<svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16z"/></svg>',
  never:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11"/></svg>',
  more:'<svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S = {screen:'typed', size:'', anim:true};
const CARET = '<span class="caret"></span>';

const WHY = {
  typed:'You swiped “cafe” but it wrote “cage”, and you only see it after “tomorrow”. Today the only fix is to backspace through “tomorrow”. The bar shows next words, as usual.',
  tap:'Tap anywhere in “cage”, or just after it. The bar switches to that word: “cage” in the pill with a small FIXING tag, and its other readings either side. If you swiped it in the last few words, these are the readings from your swipe; otherwise the nearest words to its letters. The pencil still means “Not it?”.',
  swapped:'Tap “cafe”. It replaces “cage” in place, and the cursor jumps back to where you were, after “tomorrow”, so you just keep typing. The bar says what it did for 4 seconds with Undo. Like fixing the last word today, the keyboard learns you meant “cafe” here.',
  menu:'Hold the word (or any reading) for a third of a second: the same Never suggest / Suggest more menu as on the guesses bar. Tapping the word closes it.',
  blocked:'Never suggest swaps nothing by itself: “cage” stays in the text, the keyboard just stops offering it. Tap a reading to fix the text too.',
  typeit:'If the right word isn\'t there, the pencil opens the “Not it?” field for this word. Save replaces “cage” and remembers the swipe for that word, as for the last word today.',
  select:'Selecting the word (double tap, or drag) does the same as tapping into it. With more than one word selected the bar stays as it is, and a key types over the selection as today.',
  typing:'Any key just types at the cursor, as today, and the bar goes back to guesses for what you type. Moving the cursor out of the word does the same.',
};

function keys(){
  const r = ['qwertyuiop','asdfghjkl','zxcvbnm'];
  return `<div class="keys">
    <div class="krow">${[...r[0]].map(c=>`<button class="key">${c}</button>`).join('')}</div>
    <div class="krow" style="padding:0 16px">${[...r[1]].map(c=>`<button class="key">${c}</button>`).join('')}</div>
    <div class="krow"><button class="key fn">⇧</button>${[...r[2]].map(c=>`<button class="key">${c}</button>`).join('')}<button class="key fn">⌫</button></div>
    <div class="krow"><button class="key fn">123</button><button class="key space">Astrotype</button><button class="key ret">return</button></div></div>`;
}
function keyboard(fieldHtml, barHtml, hint){
  return `<div class="screen${S.anim?' anim':''}">
    <div class="thread"><div class="msg">Where do you want to meet?</div></div>
    <div class="compose"><div class="field">${fieldHtml}</div></div>
    <div class="kb"><div class="kbar fresh" role="toolbar" aria-label="Suggestions">${barHtml}${hint?`<div class="hint">${hint}</div>`:''}</div>${keys()}</div></div>`;
}
function plain(words){
  return `<div><button class="icon" aria-label="Next keyboard">${ICON.globe}</button></div>
    <div class="center">${words.map(w=>`<button class="g alt">${esc(w)}</button>`).join('')}</div>
    <div><button class="icon" aria-label="Not it?">${ICON.pencil}</button></div>`;
}
function earlier(words, chosen, held){
  return `<div><button class="icon" aria-label="Next keyboard">${ICON.globe}</button></div>
    <div class="center">${words.map((w,i)=> i===chosen
      ? `<span class="pillwrap"><span class="tag">Fixing</span><button class="g pill${i===held?' held':''}" data-go="menu">${esc(w)}</button></span>`
      : `<button class="g alt" data-go="${w==='cafe'?'swapped':'tap'}">${esc(w)}</button>`).join('')}</div>
    <div><button class="icon" aria-label="Not it? Type the word you meant" data-go="typeit">${ICON.pencil}</button></div>`;
}
function menu(word){
  return `<div class="center" style="grid-column:1/-1"><div class="wm anim">
      <span class="side l"><button class="act never" data-go="blocked">${ICON.never}<span class="long">Never suggest</span><span class="short">Never</span></button></span>
      <button class="word" data-go="tap" aria-label="Cancel, keep ${esc(word)} as it is">${esc(word)}</button>
      <span class="side r"><button class="act more" data-go="tap">${ICON.more}<span class="long">Suggest more</span><span class="short">More</span></button></span></div></div>`;
}
function note(text, back){
  return `<div></div><div class="center"><div class="undo"><span>${text}</span><button data-go="${back}">Undo</button></div></div><div></div>`;
}
const T = 'Let\'s meet at the ';
const SCREENS = {
  typed:()=>keyboard(`${T}cage tomorrow ${CARET}`, plain(['at','morning','then'])),
  tap:()=>keyboard(`${T}ca<span class="fingertap"></span>${CARET}ge tomorrow `, earlier(['cafe','cage','case'],1)),
  swapped:()=>keyboard(`${T}cafe tomorrow ${CARET}`, note('Changed “cage” to “cafe”','tap')),
  menu:()=>keyboard(`${T}ca${CARET}ge tomorrow `, menu('cage')),
  blocked:()=>keyboard(`${T}ca${CARET}ge tomorrow `, note('Won\'t suggest “cage”','menu')),
  typeit:()=>keyboard(`${T}ca${CARET}ge tomorrow `,
    `<div class="center" style="grid-column:1/-1"><div class="notit"><button class="icon" aria-label="Cancel" data-go="tap">${ICON.close}</button><div class="box">caf<span class="caret"></span></div><button class="save" data-go="swapped">Save</button></div></div>`),
  select:()=>keyboard(`${T}<span class="sel">cage</span> tomorrow `, earlier(['cafe','cage','case'],1)),
  typing:()=>keyboard(`${T}cag${CARET}e tomorrow `, `<div><button class="icon" aria-label="Next keyboard">${ICON.globe}</button></div><div class="center"><button class="g alt">cage</button><button class="g pill">cag</button><button class="g alt">cab</button></div><div><button class="icon" aria-label="Not it?">${ICON.pencil}</button></div>`),
};

const phone = document.getElementById('phone');
function render(){
  phone.className = 'phone' + (S.size ? ' ' + S.size : '');
  phone.innerHTML = `<div class="status"><span>9:41</span><span>●●●</span></div>` + SCREENS[S.screen]();
  document.querySelectorAll('#picker [data-s]').forEach(b => b.setAttribute('aria-current', b.dataset.s === S.screen));
  document.getElementById('why').textContent = WHY[S.screen];
}
function go(s){ S.screen = s; render(); try{ history.replaceState(null,'','#'+s+(S.size?'-'+S.size:'')); }catch(e){} }
document.getElementById('picker').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.s) go(b.dataset.s);
  if (b.dataset.size !== undefined){ S.size = b.dataset.size; document.querySelectorAll('#size button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render(); }
  if (b.dataset.theme !== undefined){ if (b.dataset.theme) document.documentElement.dataset.theme = b.dataset.theme; else delete document.documentElement.dataset.theme;
    document.querySelectorAll('#theme button').forEach(x=>x.setAttribute('aria-pressed', x===b)); }
});
phone.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b && b.dataset.go) go(b.dataset.go); });
const h = (location.hash||'').slice(1).split('-');
if (SCREENS[h[0]]) S.screen = h[0];
if (h[1]==='small'||h[1]==='wide'){ S.size=h[1]; document.querySelectorAll('#size button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.size===h[1])); }
render();
</script>
</body>
</html>
