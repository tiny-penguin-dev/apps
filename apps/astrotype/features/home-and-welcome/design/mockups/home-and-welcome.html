<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astrotype Home and Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* One phone on a pale ice stage with a screen picker beside it. Tokens and components are Astrotype's (DESIGN.md "Design system"), same names as the other feature mockups.
   New here: WizardPage (progress bar, title, line, content, one big button), StepProgress, the Your keyboard card (StylePreview + ThemeCard row + effect chips). */
:root{
  --stage:#E6F0F4; --bg:#F3F8FA; --card:#FFFFFF; --ink:#1E2945; --muted:#67748F; --line:#DCE6EC;
  --accent:#139FB5; --accent-ink:#FFFFFF; --left:#139FB5; --right:#FF6F86; --sun:#FFC24D; --mint:#2FBF96; --ice:#D9EDF3;
  --font:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#0A1118; --bg:#111A24; --card:#1A2634; --ink:#EEF4F8; --muted:#97A6B8; --line:#2A3B4C;
  --accent:#2FC6DC; --accent-ink:#06202A; --left:#2FC6DC; --right:#FF8A9E; --sun:#FFCD66; --mint:#45D3AA; --ice:#1D3240; color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#0A1118; --bg:#111A24; --card:#1A2634; --ink:#EEF4F8; --muted:#97A6B8; --line:#2A3B4C;
  --accent:#2FC6DC; --accent-ink:#06202A; --left:#2FC6DC; --right:#FF8A9E; --sun:#FFCD66; --mint:#45D3AA; --ice:#1D3240; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding-block:24px;flex-wrap:wrap}
.picker{display:flex;flex-direction:column;gap:6px;max-width:270px;min-width:0}
.picker h1{font-size:28px;font-weight:900;margin:0}
.picker p{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.45}
.picker button{font-weight:700;font-size:14px;text-align:left;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:10px;cursor:pointer}
.picker button[aria-current="true"]{background:var(--card);color:var(--ink)}
.picker small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;margin-top:10px;padding-left:12px}
.picker button:focus-visible,.phone :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg-mini{display:flex;gap:4px;margin-top:4px;padding-left:8px;flex-wrap:wrap}
.seg-mini button{padding:5px 10px;font-size:12px;background:var(--line)}
.seg-mini button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.why{font-size:13px;color:var(--muted);line-height:1.45;background:var(--card);border-radius:12px;padding:10px 12px;margin-top:10px}
.phone{width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:48px;position:relative;overflow:hidden;
  box-shadow:0 0 0 10px var(--ink),0 30px 60px rgba(20,30,60,.25);flex:none}
.phone.small{width:375px;height:667px;border-radius:36px}
.phone.wide{width:744px;height:1024px;border-radius:40px}
@media (max-width:700px){.picker{max-width:100%;flex-direction:row;flex-wrap:wrap;align-items:center}.picker h1,.picker p,.why{width:100%}.picker small{display:none}
  .phone{box-shadow:none;border-radius:32px}.phone.wide{display:none}}
.status{position:absolute;top:14px;left:30px;right:30px;display:flex;justify-content:space-between;font-weight:800;font-size:15px;z-index:3}
.phone.small .status{top:8px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:54px 0 0}
.phone.small .screen{padding-top:34px}
.screen.anim{animation:in .45s var(--spring)}
@keyframes in{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
.nav{display:flex;align-items:center;padding:0 22px;height:40px;flex:none}
.back{font-weight:800;color:var(--accent);background:none;border:0;font-size:17px;padding:0;cursor:pointer}
.scroll{overflow-y:auto;flex:1;padding:0 22px 40px;display:flex;flex-direction:column;gap:12px}
.phone.small .scroll{padding:0 14px 30px}
.phone.wide .scroll{padding:0 40px 40px}
.h1{font-size:30px;font-weight:900;line-height:1.1;margin:4px 0 6px;text-wrap:balance}
.phone.small .h1{font-size:26px}
.sub{color:var(--muted);font-size:15px;line-height:1.45;margin:0}
.sec{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 -4px 6px;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border-radius:var(--r-md);padding:16px}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--ice);color:var(--ink);white-space:nowrap}
.chip.on{background:color-mix(in srgb,var(--mint) 25%,transparent)}
.btn{font-weight:800;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:14px;padding:10px 16px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000 25%);transition:transform .25s var(--spring)}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;padding:8px}
.btn.wide{width:100%;font-size:17px;padding:15px}
.btn.small{font-size:13px;padding:7px 12px;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000 25%)}
.pro{font-size:10px;font-weight:900;letter-spacing:.08em;background:var(--sun);color:#3A2600;padding:3px 6px;border-radius:6px;font-style:normal}
.big{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.unit{font-weight:800;color:var(--muted);font-size:15px}
.group{background:var(--card);border-radius:var(--r-md);overflow:hidden}
.group>.r+.r{border-top:1px solid var(--line)}
.r{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:52px;width:100%;color:inherit;text-align:left;background:none;border:0}
button.r{cursor:pointer}
.r .t{flex:1;min-width:0}
.r .t b{display:block;font-size:16px;font-weight:800}
.r .t span{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:1px}
.chev{color:var(--muted);font-weight:900;font-size:18px}
.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;font-size:15px;font-weight:900}
.badge{width:28px;height:28px;border-radius:50%;background:var(--ice);display:grid;place-items:center;font-weight:900;flex:none;font-size:14px}
.badge.done{background:var(--mint);color:#fff}
.week{display:flex;justify-content:space-between;padding:4px 6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.week i{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;color:#fff}
.week i.y{background:var(--mint)}
.cols{display:flex;flex-direction:column;gap:12px}
.phone.wide .cols{flex-direction:row;align-items:flex-start;gap:24px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.scroll>*,.col>*,.wbody>*{flex-shrink:0}
.phone.wide .cols>.col{flex:1}
.note{color:var(--muted);font-size:13px;line-height:1.45;margin:2px 6px 0}
.banner{background:color-mix(in srgb,var(--sun) 35%,var(--card));border-radius:var(--r-md);padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px}

/* Home header + speed card */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;padding-top:12px}
.hdr .h1{font-size:34px;margin:0}
.thumbs{width:68px;height:68px;flex:none}
.spark{width:100%;height:46px;display:block}
.spark .ln{fill:none;stroke:var(--left);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.spark .fl{fill:color-mix(in srgb,var(--left) 14%,transparent)}
.spark .pd{fill:var(--right);stroke:var(--card);stroke-width:2}

/* Your keyboard card */
.kcard{display:flex;flex-direction:column;gap:12px;padding:12px}
.kcard .lbl{font-size:13px;font-weight:900;color:var(--muted);letter-spacing:.04em;margin:2px 4px -4px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:6px 6px 6px;margin:0 -4px;scroll-snap-type:x proximity;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tcard{flex:none;width:96px;border:0;background:none;padding:0;cursor:pointer;scroll-snap-align:start;display:flex;flex-direction:column;gap:5px;align-items:stretch;transition:transform .3s var(--spring)}
.tcard:active{transform:scale(.95)}
.tcard .mini{border-radius:12px;padding:5px;display:flex;flex-direction:column;gap:3px;outline:3px solid transparent;outline-offset:2px;transition:outline-color .2s}
.tcard[aria-pressed="true"] .mini{outline-color:var(--accent)}
.tcard .mini div{display:flex;gap:2px;justify-content:center}
.tcard .mini i{height:9px;flex:1;max-width:8px;border-radius:2px;background:var(--mkey);box-shadow:0 0 0 var(--mbw) var(--mbc)}
.tcard .mini i.f{background:var(--mfn);max-width:12px}
.tcard .mini i.sp{max-width:none;flex:5}
.tcard .mini i.l{background:var(--mleft)}.tcard .mini i.rr{background:var(--mright)}
.tcard .nm{font-size:13px;font-weight:800;display:flex;gap:4px;align-items:center;justify-content:center}
.fxchips{display:flex;flex-wrap:wrap;gap:8px}
.fxchip{border:0;cursor:pointer;font-weight:800;font-size:14px;padding:8px 12px;border-radius:999px;background:var(--bg);display:inline-flex;align-items:center;gap:6px;transition:transform .3s var(--spring),background .2s}
.fxchip:active{transform:scale(.94)}
.fxchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fxchip .dot{width:10px;height:10px;border-radius:50%}
.sl{display:flex;flex-direction:column;gap:6px;padding:0 4px}
.sl .top{display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.sl .top span{color:var(--muted);font-variant-numeric:tabular-nums}
.sl .ends{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:800}
input[type=range]{flex:1;accent-color:var(--accent)}
.more{display:flex;align-items:center;justify-content:space-between;border:0;background:var(--bg);border-radius:12px;padding:11px 14px;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink)}
.more span{color:var(--muted);font-weight:700;font-size:13px}
.resting{background:color-mix(in srgb,var(--sun) 28%,var(--card));border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.4}

/* The live keyboard (StylePreview) */
.kbd{position:relative;border-radius:16px;padding:6px 3px 8px;background:var(--kkb);font-family:var(--kfont);user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;transition:background .35s}
.kbd .kbar{display:flex;justify-content:center;gap:22px;font-size:14px;color:var(--kink);opacity:.75;padding:3px 0 6px;font-family:var(--font);font-weight:700;min-height:26px}
.kbd .kbar .mid{opacity:1;background:var(--kfn);padding:1px 10px;border-radius:999px}
.krow{display:flex;justify-content:center;gap:var(--kgap);margin-bottom:var(--kgap);padding:0 2px}
.krow.r2{padding:0 5%}
.k{flex:1;max-width:10%;height:var(--kh);border-radius:var(--krad);background:var(--kkey);color:var(--kink);display:grid;place-items:center;font-size:calc(var(--kh)*.44);
  box-shadow:var(--ksh),inset 0 0 0 var(--kbw) var(--kbc);transition:background .35s,color .35s,transform .25s var(--spring),border-radius .35s;position:relative}
.k.f{background:var(--kfn);max-width:13%;font-size:calc(var(--kh)*.3);font-family:var(--font);font-weight:700}
.k.space{max-width:none;flex:5;font-size:calc(var(--kh)*.32)}
.k.ret{max-width:none;flex:1.6}
.k.hit{transform:scale(.9)}
.k.lit{background:var(--klit)!important;color:#fff}
.k.jolt{animation:jolt .18s steps(3)}
@keyframes jolt{0%{transform:translate(2px,-1px)}50%{transform:translate(-3px,1px);filter:hue-rotate(90deg)}100%{transform:none}}
.kbd.flip .k{animation:flip .5s var(--spring)}
@keyframes flip{0%{transform:scale(.8)}100%{transform:none}}
.kbd canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kbd .combo{position:absolute;right:10px;top:5px;font-family:var(--font);font-weight:900;font-size:13px;color:var(--kacc);opacity:0;transition:opacity .2s}
.tryline{text-align:center;color:var(--muted);font-size:13px;font-weight:700;margin-top:-4px}

/* Wizard (WizardPage + StepProgress) */
.wtop{display:flex;align-items:center;gap:14px;padding:6px 22px 0;height:40px;flex:none}
.prog{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:var(--accent);width:var(--p);transition:width .6s var(--spring)}
.wtop .skip{font-weight:800;color:var(--muted);background:none;border:0;font-size:15px;cursor:pointer;padding:6px 0}
.wbody{flex:1;overflow-y:auto;padding:8px 22px 12px;display:flex;flex-direction:column;gap:14px}
.phone.small .wbody{padding:4px 14px 8px}
.phone.wide .wbody,.phone.wide .wfoot{width:560px;align-self:center}
.wfoot{padding:10px 22px 34px;display:flex;flex-direction:column;gap:4px;flex:none}
.phone.small .wfoot{padding:8px 14px 18px}
.art{display:grid;place-items:center;padding:6px 0}
.step{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700}
.step .badge{background:var(--accent);color:var(--accent-ink)}
.step b{color:var(--accent)}
.toggle{width:52px;height:32px;border-radius:999px;background:var(--mint);border:0;position:relative;flex:none;padding:0;cursor:pointer}
.toggle::after{content:"";position:absolute;top:3px;left:23px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .3s var(--spring)}
.toggle[aria-checked="false"]{background:var(--line)}.toggle[aria-checked="false"]::after{left:3px}
.word{font-size:34px;font-weight:900}
.field{min-height:52px;padding:12px 16px;border-radius:var(--r-md);background:var(--card);font-size:20px;font-weight:700;display:flex;align-items:center}
.field .caret{width:2px;height:24px;background:var(--accent);margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hint{color:var(--muted);font-size:14px;line-height:1.5}
.hint .L{color:var(--left);font-weight:900}.hint .R{color:var(--right);font-weight:900}.hint b{color:var(--ink)}
.kdock{padding:0 4px 26px;flex:none}
.phone.wide .kdock{width:620px;align-self:center}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:5}
.stub{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;flex:1;text-align:center;padding:30px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.screen.anim,.kbd.flip .k,.k.jolt{animation:none}.prog i{transition:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="picker" role="navigation" aria-label="Screens">
    <h1>Home and welcome</h1>
    <p>Your keyboard's look on Home, and a welcome wizard that sets it up and teaches it. Tap through: the buttons in the phone work.</p>
    <small>Home</small>
    <button data-s="before">Home today (before)</button>
    <button data-s="home">New Home</button>
    <button data-s="homeFree">New Home, trial over</button>
    <small>Welcome wizard</small>
    <button data-s="hello">1 · Hello</button>
    <button data-s="turnOn">2 · Turn it on</button>
    <button data-s="languages">3 · Languages</button>
    <button data-s="style">4 · Make it yours</button>
    <button data-s="tryIt">5 · Try it</button>
    <button data-s="sync">6 · Keep your words</button>
    <button data-s="arrive">Home, first time</button>
    <small>From Home</small>
    <button data-s="lesson">Learn two thumbs again</button>
    <small>Look</small>
    <div class="seg-mini" id="sizes"><button data-size="">iPhone</button><button data-size="small">Small</button><button data-size="wide">Wide</button></div>
    <div class="seg-mini" id="themes"><button data-theme="light">Light</button><button data-theme="dark">Dark</button></div>
    <div class="why" id="why"></div>
  </div>
  <div class="phone" id="phone"></div>
</div>
<script>
/* ---------- Data (matches the app: KeyboardTheme.swift, EffectsSettings.Preset) ---------- */
const SHAPE={gap:6,radius:6,bw:0,shadow:"soft",font:"rounded"};
const T=(name,light,dark,shape={})=>({name,light,dark,shape:{...SHAPE,...shape}});
const THEMES={
  classic:T("Classic",{kb:"#D1D3D9",key:"#FFFFFF",fn:"#EDEEF0",ink:"#000000",bc:"#000",left:"#139FB5",right:"#FF6F86",acc:"#636366"},
                      {kb:"#2A2A2C",key:"#6B6B6B",fn:"#4A4A4A",ink:"#FFFFFF",bc:"#FFF",left:"#2FC6DC",right:"#FF8A9E",acc:"#A0A0A0"},{gap:4,radius:10,shadow:"none"}),
  iceberg:T("Iceberg",{kb:"#D9EDF3",key:"#FFFFFF",fn:"#BFE0EA",ink:"#1E2945",bc:"#139FB5",left:"#139FB5",right:"#FF6F86",acc:"#139FB5"},
                      {kb:"#0E1C27",key:"#1D3240",fn:"#152836",ink:"#D9F4FF",bc:"#2FC6DC",left:"#2FC6DC",right:"#FF8A9E",acc:"#2FC6DC"},{radius:9}),
  tuxedo:T("Tuxedo",{kb:"#E9E9EC",key:"#1C1C1E",fn:"#3A3A3C",ink:"#FFFFFF",bc:"#FF9F1C",left:"#FF9F1C",right:"#FFC94D",acc:"#FF9F1C"},
                    {kb:"#000000",key:"#1C1C1E",fn:"#2C2C2E",ink:"#FFFFFF",bc:"#FF9F1C",left:"#FF9F1C",right:"#FFC94D",acc:"#FF9F1C"},{radius:8}),
  krill:T("Krill",{kb:"#FFE4E8",key:"#FFFFFF",fn:"#FFC7D1",ink:"#7A2E3B",bc:"#FF6F86",left:"#FF6F86",right:"#FF9F1C",acc:"#FF6F86"},
                  {kb:"#26121A",key:"#46222D",fn:"#371A23",ink:"#FFD9E0",bc:"#FF8A9E",left:"#FF8A9E",right:"#FFB25C",acc:"#FF8A9E"},{radius:12}),
  midnight:T("Midnight",{kb:"#E8EAFF",key:"#FFFFFF",fn:"#D3D7FA",ink:"#283070",bc:"#5B6CFF",left:"#5B6CFF",right:"#B15CFF",acc:"#5B6CFF"},
                        {kb:"#0B1026",key:"#1A2246",fn:"#141B3A",ink:"#C9F7FF",bc:"#2FC6DC",left:"#2FC6DC",right:"#B98CFF",acc:"#7B61FF"},{bw:1,radius:8}),
  paper:T("Paper",{kb:"#F7F3EA",key:"#F7F3EA",fn:"#ECE5D3",ink:"#2B2A26",bc:"#2B2A26",left:"#2B2A26",right:"#C2410C",acc:"#C2410C"},
                  {kb:"#1A1916",key:"#1A1916",fn:"#26241F",ink:"#EDE6D6",bc:"#EDE6D6",left:"#EDE6D6",right:"#FB923C",acc:"#FB923C"},{bw:1.5,shadow:"none",font:"classic",radius:4}),
  arcade:T("Arcade",{kb:"#FFF0FB",key:"#FFFFFF",fn:"#FBD9F3",ink:"#8A00D4",bc:"#00B8D4",left:"#00B8D4",right:"#FF2DAA",acc:"#FF2DAA"},
                  {kb:"#0D0221",key:"#1A0B3A",fn:"#140830",ink:"#FF4FD8",bc:"#00F0FF",left:"#00F0FF",right:"#FF4FD8",acc:"#FF4FD8"},{bw:1.5,shadow:"none",font:"mono",radius:4}),
  bold:T("Bold",{kb:"#FFFFFF",key:"#FFFFFF",fn:"#E5E5E5",ink:"#000000",bc:"#000000",left:"#0057FF",right:"#E00000",acc:"#0057FF"},
                {kb:"#000000",key:"#000000",fn:"#1A1A1A",ink:"#FFFFFF",bc:"#FFFFFF",left:"#4DA3FF",right:"#FF5C5C",acc:"#4DA3FF"},{bw:2,shadow:"none",radius:6}),
};
const FONTS={rounded:"ui-rounded,'SF Pro Rounded','Nunito',system-ui,sans-serif",classic:"-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif",mono:"ui-monospace,'SF Mono',Menlo,Consolas,monospace"};
// Each preset's touch, in a few words. The real ones are Metal; these are sketches.
const FX={
  calm:{name:"Calm",c:"#139FB5",tap:"ring",trail:"line"},
  arcade:{name:"Arcade",c:"#FF2DAA",tap:"burst",trail:"rainbow",confetti:true},
  glitch:{name:"Glitch",c:"#7B61FF",tap:"glitch",trail:"line"},
  rainbow:{name:"Rainbow",c:"#FF9F1C",tap:"ring",trail:"rainbow"},
  space:{name:"Space",c:"#2B3A8C",tap:"stars",trail:"comet"},
  zen:{name:"Zen",c:"#2FBF96",tap:"soft",trail:"line"},

/* ---------- Effects sketch on the live keyboard ---------- */
const live=new Set();
function wireKbd(el,onKey){
  const cv=el.querySelector("canvas"),g=cv.getContext("2d");const parts=[];const trail=[];let combo=0,comboT=0;
  const size=()=>{const r=el.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;g.setTransform(2,0,0,2,0,0)};size();
  const fx=()=>FX[shownFx()];const th=()=>THEMES[shownTheme()][look()];
  const keyAt=(x,y)=>{const r=el.getBoundingClientRect();for(const k of el.querySelectorAll(".k")){const b=k.getBoundingClientRect();if(x>=b.left-r.left-2&&x<=b.right-r.left+2&&y>=b.top-r.top-2&&y<=b.bottom-r.top+2)return k}return null};
  const centre=k=>{const r=el.getBoundingClientRect(),b=k.getBoundingClientRect();return{x:b.left-r.left+b.width/2,y:b.top-r.top+b.height/2}};
  function burst(x,y,side){const f=fx(),c=side==="R"?th().right:th().left;const rm=matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(f.tap==="none")return;
    if(f.tap==="ring"||f.tap==="soft")parts.push({k:"ring",x,y,r:4,life:1,c,soft:f.tap==="soft"});
    if(f.tap==="burst"||f.tap==="stars"||f.tap==="hearts"){const n=rm?4:f.tap==="burst"?14:9;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=1.5+Math.random()*3.5;
      parts.push({k:f.tap==="hearts"?"heart":f.tap==="stars"?"star":"dot",x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:1,c:f.tap==="burst"?`hsl(${Math.random()*360},90%,60%)`:f.tap==="hearts"?["#FF6FB5","#FFB3D9","#FFC24D"][i%3]:"#FFE88A"})}}
    if(f.tap==="glitch"){parts.push({k:"glitch",x,y,life:1,c})}
    if(f.confetti&&!rm){combo++;comboT=900;const cb=el.querySelector(".combo");cb.textContent="×"+combo;cb.style.opacity=1}
  }
  function press(k,side){if(!k)return;k.classList.add("hit");setTimeout(()=>k.classList.remove("hit"),140);
    if(fx().tap==="glitch"){k.classList.add("jolt");setTimeout(()=>k.classList.remove("jolt"),200)}
    const p=centre(k);burst(p.x,p.y,side);onKey&&onKey(k.dataset.k)}
  function lit(k,side){if(!k||fx().trail==="none")return;k.style.setProperty("--klit",side==="R"?th().right:th().left);k.classList.add("lit");setTimeout(()=>k.classList.remove("lit"),220)}
  let ptr=null;
  el.addEventListener("pointerdown",e=>{size();const r=el.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;const side=x<r.width/2?"L":"R";
    ptr={side,key:keyAt(x,y),moved:false,keys:[keyAt(x,y)]};trail.length=0;trail.push({x,y,t:performance.now(),side});el.setPointerCapture(e.pointerId)});
  el.addEventListener("pointermove",e=>{if(!ptr)return;const r=el.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;trail.push({x,y,t:performance.now(),side:ptr.side});
    const k=keyAt(x,y);if(k&&k!==ptr.key){ptr.moved=true;ptr.key=k;ptr.keys.push(k);lit(k,ptr.side)}});
  el.addEventListener("pointerup",e=>{if(!ptr)return;if(!ptr.moved)press(ptr.key,ptr.side);else{const r=el.getBoundingClientRect();burst(e.clientX-r.left,e.clientY-r.top,ptr.side);ptr.keys.forEach(k=>k&&onKey&&k.dataset.k.length===1&&onKey(k.dataset.k))}ptr=null});
  const eng={el,step(dt){const W=cv.width/2,H=cv.height/2;g.clearRect(0,0,W,H);const f=fx();
    if(comboT>0){comboT-=dt;if(comboT<=0){combo=0;el.querySelector(".combo").style.opacity=0}}
    const now=performance.now();while(trail.length&&now-trail[0].t>(f.trail==="comet"?380:260))trail.shift();
    if(f.trail!=="none"&&trail.length>1){for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i],age=1-(now-b.t)/300;
      g.strokeStyle=f.trail==="rainbow"?`hsl(${(b.t/3)%360},90%,60%)`:(b.side==="R"?th().right:th().left);g.globalAlpha=Math.max(0,age);g.lineWidth=f.trail==="comet"?2+8*age:5*age+1;g.lineCap="round";
      g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}g.globalAlpha=1}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt/(p.soft?900:520);if(p.life<=0){parts.splice(i,1);continue}g.globalAlpha=p.life;
      if(p.k==="ring"){p.r+=dt*(p.soft?.04:.09);g.strokeStyle=p.c;g.lineWidth=p.soft?2:3;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.stroke()}
      else if(p.k==="glitch"){g.fillStyle="#FF2DAA";g.fillRect(p.x-30+Math.random()*8,p.y-6,40,3);g.fillStyle="#00F0FF";g.fillRect(p.x-18+Math.random()*8,p.y+3,48,2);g.fillStyle=p.c;g.fillRect(p.x-12,p.y-1+Math.random()*4-2,28,2)}
      else{p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vy+=.08*dt/16;g.fillStyle=p.c;
        if(p.k==="heart"){g.font="12px sans-serif";g.fillText("♥",p.x-4,p.y+4)}else if(p.k==="star"){g.font="11px sans-serif";g.fillText("✦",p.x-4,p.y+4)}else{g.fillRect(p.x-2,p.y-2,4,4)}}
      g.globalAlpha=1}
  },press,lit,centre,keyFor:c=>el.querySelector(`.k[data-k="${c}"]`)};
  live.add(eng);return eng;
}
let lastT=performance.now();

      <p class="sub">Tap with one, swipe with the other, mix them any way you like. Press space when the word looks right. We'll show you.</p></div>
      <div class="wfoot"><button class="btn wide" data-next>Let's go</button></div>`,
  turnOn:()=>wizard("turnOn",{title:"Turn on Astrotype",body:"iPhone keyboards switch on in Settings. It takes three taps, and I'll know when it's done.",
    content:`<div class="step"><span class="badge">1</span><span>Open <b>Settings</b></span></div><div class="step"><span class="badge">2</span><span>Tap <b>Keyboards</b></span></div><div class="step"><span class="badge">3</span><span>Turn on <b>Astrotype</b></span></div>
      <div class="card row">${S.keyboardOn?`<span class="chip on">On</span><b>Astrotype is on. Hold 🌐 in any app to pick it.</b>`:`<span class="chip">Not on yet</span><span class="note" style="margin:0">Come back here after Settings.</span>`}</div>`,
    buttons:S.keyboardOn?`<button class="btn wide" data-next>Next</button>`:`<button class="btn wide" data-act="turnon">Open Settings</button><button class="btn ghost" data-next>I'll do it later</button>`}),
  languages:()=>wizard("languages",{title:"Which languages do you type in?",body:"With two on, Astrotype guesses from both as you go. No switching. Free types in one; your trial covers both.",
    content:`<div class="group">${[["en","English","English"],["es","Español","Spanish"]].map(([c,n,e])=>row({lead:`<span class="ic" style="background:${c==="en"?"var(--left)":"var(--right)"}">${c.toUpperCase()}</span>`,title:n,sub:e,end:`<button class="toggle" role="switch" aria-label="${n}" aria-checked="${S.langs[c]}" data-lang="${c}"></button>`})).join("")}</div>`,
    buttons:`<button class="btn wide" data-next>Continue</button>`}),
  style:()=>wizard("style",{title:"Make it yours",body:"Pick a look and a little sparkle. You can change it any time on Home.",
    content:keyboardCard({big:true,more:false,height:false}),buttons:`<button class="btn wide" data-next>Looks good</button>`}),
  tryIt:()=>{const W=WORDS[S.tryIdx];return wizard("tryIt",{title:"",
    content:`<div class="row"><span class="chip">Try it · word ${S.tryIdx+1} of 5</span></div>
      <div><div class="note" style="margin:0">Type this word</div><div class="word">${W.w}</div></div>
      <div class="field" id="field">${S.typed}<span class="caret"></span></div>
      <div class="hint">${W.hint}</div>
      <div class="row"><button class="btn small" data-act="showme">Show me</button><span class="note" style="margin:0">or just try it</span></div>`,
    dock:`<div class="kdock">${kbd({h:40,bar:`<span class="mid">${S.typed||"&nbsp;"}</span>`})}</div>`,buttons:""})},
  sync:()=>wizard("sync",{title:"Keep your words everywhere",body:"Astrotype just learned your first words. With Full Access they sync over iCloud to your other devices, along with your look. Nothing you type is ever sent anywhere.",
    content:`<div class="art"><svg width="150" height="110" viewBox="0 0 150 110" aria-hidden="true"><path d="M40 90 a26 26 0 0 1 4-52 a34 34 0 0 1 64 6 a22 22 0 0 1 2 46z" fill="var(--ice)"/><text x="75" y="76" text-anchor="middle" font-size="22" font-weight="900" fill="var(--accent)" font-family="var(--font)">5 words</text></svg></div>
      <div class="step"><span class="badge">1</span><span>Settings › Keyboards › <b>Astrotype</b></span></div><div class="step"><span class="badge">2</span><span>Turn on <b>Allow Full Access</b></span></div>`,
    buttons:`<button class="btn wide" data-act="finish">Open Settings</button><button class="btn ghost" data-act="finish">Skip for now</button>`}),
  lesson:()=>SCREENS.tryIt(),
  stub:()=>`<div class="nav"><button class="back" data-go="home">‹ Home</button></div><div class="stub"><div class="h1" style="color:var(--ink)">${S.stub}</div><p>${S.stubWhy}</p></div>`,
};

/* ---------- Render ---------- */
function render(anim=true){
  phone.className="phone "+S.size;
  const scr=["homeFree"].includes(S.screen)?"home":S.screen;
  phone.innerHTML=status()+`<div class="screen ${anim?"anim":""}">${SCREENS[S.screen]()}</div>`;
  if(S.screen==="arrive"&&anim)confetti();
  document.querySelectorAll(".picker [data-s]").forEach(b=>b.setAttribute("aria-current",b.dataset.s===S.screen));
  document.querySelectorAll("#sizes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.size===S.size));
  document.querySelectorAll("#themes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.theme===(pageDark()?"dark":"light")));
  document.getElementById("why").textContent=WHY[S.screen]||"";
  const kb=phone.querySelector("[data-kb]");
  S.eng=kb?wireKbd(kb,S.screen==="tryIt"||S.screen==="lesson"?typeKey:null):null;
  const pr=phone.querySelector(".prog");if(pr){requestAnimationFrame(()=>requestAnimationFrame(()=>pr.style.setProperty("--p",(STEPS.indexOf(S.screen)+1)/STEPS.length*100+"%")))}
  const h=phone.querySelector("#height");if(h)h.oninput=e=>{S.height=+e.target.value;phone.querySelector("#hv").textContent=S.height+"%";const k=phone.querySelector("[data-kb]");k.style.setProperty("--kh",Math.round((S.screen==="style"?40:36)*S.height/100)+"px")};
}
function go(s){S.prevP=STEPS.includes(S.screen)?STEPS.indexOf(S.screen)+1:0;if(s==="homeFree")S.pro=false;else if(["home","arrive","before"].includes(s)&&S.screen==="homeFree")S.pro=true;
  if(s==="tryIt"||s==="lesson"){S.tryIdx=0;S.typed=""}S.lesson=s==="lesson";S.screen=s;render()}
function next(){const i=STEPS.indexOf(S.screen);if(S.screen==="tryIt"&&S.lesson){go("home");return}go(i>=0&&i<STEPS.length-1?STEPS[i+1]:"arrive")}
function typeKey(k){
  if(k==="space"){const W=WORDS[S.tryIdx];if(S.typed===W.w){if(S.tryIdx<4){S.tryIdx++;S.typed="";rerenderTry()}else{confetti();setTimeout(()=>S.lesson?go("home"):next(),1300)}}else{S.typed="";rerenderTry()}return}
  if(k==="del"){S.typed=S.typed.slice(0,-1);rerenderTry();return}
  if(k.length===1){S.typed+=k;rerenderTry()}
}
function rerenderTry(){const W=WORDS[S.tryIdx];const b=phone.querySelector(".wbody");if(!b)return;
  b.querySelector(".chip").textContent=`Try it · word ${S.tryIdx+1} of 5`;b.querySelector(".word").textContent=W.w;b.querySelector(".hint").innerHTML=W.hint;
  b.querySelector("#field").innerHTML=`${S.typed}<span class="caret"></span>`;const m=phone.querySelector(".kbar .mid");if(m)m.innerHTML=S.typed||"&nbsp;"}
function confetti(){const c=document.createElement("canvas");c.className="confetti";phone.appendChild(c);const r=phone.getBoundingClientRect();c.width=r.width;c.height=r.height;const g=c.getContext("2d");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){setTimeout(()=>c.remove(),600);return}
  const ps=Array.from({length:120},()=>({x:r.width/2+(Math.random()-.5)*80,y:r.height*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,c:["#139FB5","#FF6F86","#FFC24D","#2FBF96","#7B61FF"][Math.floor(Math.random()*5)],s:4+Math.random()*5,a:Math.random()*6}));
  let t=0;(function f(){t++;g.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.a+=.2;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()});if(t<140)requestAnimationFrame(f);else c.remove()})()}

phone.addEventListener("click",e=>{
  const t=e.target.closest("[data-theme-id],[data-fx],[data-go],[data-next],[data-act],[data-lang]");if(!t)return;e.preventDefault();
  if(t.dataset.themeId){if(t.dataset.locked){stub("Astrotype Pro","Today's Pro screen. Pro looks open from here.");return}
    S.kbTheme=t.dataset.themeId;const kb=phone.querySelector("[data-kb]");const th=THEMES[S.kbTheme];kb.setAttribute("style",vars(th,look())+`--kh:${kb.style.getPropertyValue("--kh")}`);
    kb.classList.remove("flip");void kb.offsetWidth;kb.classList.add("flip");
    phone.querySelectorAll("[data-theme-id]").forEach(b=>{const on=b.dataset.themeId===S.kbTheme;b.setAttribute("aria-pressed",on);b.setAttribute("aria-selected",on)});return}
  if(t.dataset.fx){if(!S.pro&&isProFx(t.dataset.fx)){stub("Astrotype Pro","Today's Pro screen. Pro effects open from here.");return}
    S.fx=t.dataset.fx;phone.querySelectorAll("[data-fx]").forEach(b=>{const on=b.dataset.fx===S.fx;b.setAttribute("aria-pressed",on);b.setAttribute("aria-checked",on)});
    demo(S.eng,[["h","L"],["e","L"],["l","R"],["l","R"],["o","R"]]);setTimeout(()=>demo(S.eng,[["w","L"],["a","L"],["d","L"]]),700);return}
  if(t.dataset.lang){const c=t.dataset.lang;const on=t.getAttribute("aria-checked")!=="true";if(!on&&Object.values(S.langs).filter(Boolean).length<2)return;S.langs[c]=on;t.setAttribute("aria-checked",on);return}
  if(t.hasAttribute("data-next")){next();return}
  if(t.dataset.act==="turnon"){S.keyboardOn=true;render(false);confetti();return}
  if(t.dataset.act==="finish"){go("arrive");return}
  if(t.dataset.act==="showme"){const W=WORDS[S.tryIdx];demo(S.eng,W.seq);S.typed="";setTimeout(()=>{S.typed=W.w;rerenderTry()},W.seq.length*200+100);return}
  const g=t.dataset.go;
  if(g==="home"){go(S.pro?"home":"homeFree");return}
  if(g==="lesson"){go("lesson");return}
  const STUBS={appearance:["Appearance","Today's Appearance page (General, Styling, Effects), unchanged. It's just one tap from Home now."],settings:["Settings","Today's Settings. Appearance stays there too."],
    pro:["Astrotype Pro","Today's Pro screen."],drill:["Drill","Today's drill screen."],pw:["Practice words","Today's Practice words."]};
  if(STUBS[g])stub(...STUBS[g]);
});
function stub(t,w){S.stub=t;S.stubWhy=w;S.from=S.screen;S.screen="stub";render()}
document.querySelector(".picker").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.s){if(b.dataset.s==="turnOn")S.keyboardOn=false;go(b.dataset.s);return}
  if(b.dataset.size!==undefined){S.size=b.dataset.size;render(false);return}
  if(b.dataset.theme){document.documentElement.dataset.theme=b.dataset.theme;render(false)}
});
const [h,hs,ht,hk,hf]=location.hash.slice(1).split(",");if(SCREENS[h])S.screen=h;if(S.screen==="homeFree")S.pro=false;
if(hs)S.size=hs==="iphone"?"":hs;if(ht)document.documentElement.dataset.theme=ht;if(hk&&THEMES[hk])S.kbTheme=hk;if(hf&&FX[hf])S.fx=hf;if(S.screen==="turnOn"&&hk==="on")S.keyboardOn=true;
render();
</script>
</body>
</html>
