<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one phone (390x844) on a pale ice stage with a screen picker beside it. The keyboard is real: tap, swipe, two thumbs on a phone. */
:root{
  --stage:#E6F0F4; --bg:#F3F8FA; --card:#FFFFFF; --ink:#1E2945; --muted:#67748F; --line:#DCE6EC;
  --accent:#139FB5; --accent-ink:#FFFFFF; --left:#139FB5; --right:#FF6F86; --sun:#FFC24D; --mint:#2FBF96; --ice:#D9EDF3;
  --key:#FFFFFF; --key-ink:#1E2945; --key-dark:#C9D6DE; --kb:#DCE6EC; --bar:#E8F0F4;
  --font:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#0A1118; --bg:#111A24; --card:#1A2634; --ink:#EEF4F8; --muted:#97A6B8; --line:#2A3B4C;
  --accent:#2FC6DC; --accent-ink:#06202A; --left:#2FC6DC; --right:#FF8A9E; --sun:#FFCD66; --mint:#45D3AA; --ice:#1D3240;
  --key:#2A3A4A; --key-ink:#EEF4F8; --key-dark:#1C2834; --kb:#131E29; --bar:#1A2634;; color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#0A1118; --bg:#111A24; --card:#1A2634; --ink:#EEF4F8; --muted:#97A6B8; --line:#2A3B4C;
  --accent:#2FC6DC; --accent-ink:#06202A; --left:#2FC6DC; --right:#FF8A9E; --sun:#FFCD66; --mint:#45D3AA; --ice:#1D3240;
  --key:#2A3A4A; --key-ink:#EEF4F8; --key-dark:#1C2834; --kb:#131E29; --bar:#1A2634;; color-scheme:dark}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding-block:24px;flex-wrap:wrap}
.picker{display:flex;flex-direction:column;gap:6px;max-width:230px;min-width:0}
.picker h1{font-size:28px;font-weight:900;margin:0}
.picker p{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.45}
.picker button{font:inherit;font-weight:700;font-size:14px;text-align:left;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:10px;cursor:pointer}
.picker button[aria-current="true"]{background:var(--card);color:var(--ink)}
.picker button:focus-visible,.phone button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.picker small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;margin-top:10px;padding-left:12px}
.themes{display:flex;gap:4px;margin-top:8px}
.themes button{padding:5px 10px;font-size:12px;background:var(--line)}
.themes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.phone{width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:48px;position:relative;overflow:hidden;
  box-shadow:0 0 0 10px var(--ink),0 30px 60px rgba(20,30,60,.25);flex:none;touch-action:none}
@media (max-width:700px){.picker{max-width:100%;flex-direction:row;flex-wrap:wrap}.picker h1,.picker p{width:100%}.picker small{display:none}
  .phone{box-shadow:none;border-radius:32px;height:820px}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:58px 22px 30px;gap:16px;animation:in .45s var(--spring)}
.screen.haskb{padding-bottom:0}
@keyframes in{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.status{position:absolute;top:14px;left:30px;right:30px;display:flex;justify-content:space-between;font-weight:800;font-size:15px;z-index:3}
.h1{font-size:30px;font-weight:900;line-height:1.1;margin:0;text-wrap:balance}
.h2{font-size:20px;font-weight:800;margin:0}
.sub{color:var(--muted);font-size:16px;line-height:1.4;margin:0}
.btn{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:999px;padding:17px 22px;background:var(--accent);color:var(--accent-ink);cursor:pointer;
  transition:transform .25s var(--spring);box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 60%,#000 25%)}
.btn:active{transform:translateY(3px) scale(.98);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000 25%)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;font-size:15px;padding:8px}
.btn.small{font-size:14px;padding:10px 16px;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000 25%)}
.spacer{flex:1}
.card{background:var(--card);border-radius:var(--r-md);padding:16px}
.row{display:flex;align-items:center;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;padding:6px 10px;border-radius:999px;background:var(--ice);color:var(--ink)}
.pro{font-size:10px;font-weight:900;letter-spacing:.08em;background:var(--sun);color:#3A2600;padding:3px 7px;border-radius:6px}
.toggle{width:52px;height:32px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .35s var(--spring)}
.toggle[aria-pressed="true"]{background:var(--mint)}
.toggle[aria-pressed="true"]::after{transform:translateX(20px)}
.back{font:inherit;font-weight:800;color:var(--accent);background:none;border:0;font-size:17px;padding:0;cursor:pointer;align-self:flex-start}
.list{display:flex;flex-direction:column;gap:10px}
.sec{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px 4px}
.scroll{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px;margin:0 -22px;padding:0 22px 10px}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps div{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r-md);padding:12px 14px;font-weight:700}
.steps div::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--ice);display:grid;place-items:center;font-weight:900;flex:none}
.steps b{color:var(--accent)}
.seg{display:flex;background:var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;font:inherit;font-weight:800;font-size:14px;border:0;background:transparent;color:var(--muted);padding:9px 0;border-radius:999px;cursor:pointer;transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.big{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.price{font:inherit;color:inherit;text-align:left;border:3px solid transparent;cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .3s var(--spring),border-color .2s}
.price[aria-pressed="true"]{border-color:var(--accent);transform:scale(1.02)}
.price b{font-size:18px;display:block}
.price span{color:var(--muted);font-size:13px}
.price .amt{margin-left:auto;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.perk{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px}
.perk i{width:22px;height:22px;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
.slider{height:6px;border-radius:3px;background:var(--line);position:relative;flex:1}
.slider::after{content:"";position:absolute;left:40%;top:-8px;width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:0 2px 4px rgba(0,0,0,.2)}
.week{display:flex;justify-content:space-between}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.week i{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;color:#fff}
.week i.y{background:var(--mint)}
.fish{position:absolute;top:-30px;width:22px;height:12px;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(900px) rotate(540deg)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
/* art: generic graphics, a keyboard with two thumb trails */
.art{display:block;margin:0 auto;overflow:visible}
.art .trail{fill:none;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.art .trail.L{stroke:var(--left)}.art .trail.R{stroke:var(--right)}
.art .dot.L{fill:var(--left)}.art .dot.R{fill:var(--right)}
.art.live .trail{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.4s var(--spring) forwards}
.art.live .trail.R{animation-delay:.35s}
.art.live .dot{transform-origin:center;transform-box:fill-box;animation:pop .5s var(--spring) 1.2s both}
.art.live .dot.R{animation-delay:1.55s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.art.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.art .ray{stroke:var(--sun);stroke-width:8;stroke-linecap:round}
.art.live .ray{transform-origin:100px 100px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.zz{font-weight:900;fill:var(--muted);animation:zz 2.6s ease-in infinite;opacity:0}
.zz:nth-of-type(2){animation-delay:1.3s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-30px)}}
/* sizes: small = iPhone Duo outer screen, phone = iPhone, wide = iPhone Duo inner screen */
.sizes{display:flex;gap:4px;margin-top:8px}
.sizes button{padding:5px 10px;font-size:12px;background:var(--line)}
.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.phone.small{width:420px;height:700px;border-radius:40px}
.phone.wide{width:744px;height:1024px;border-radius:40px}
.phone.wide .screen{padding-left:40px;padding-right:40px}
.phone.wide .scroll,.phone.wide .kbwrap,.phone.wide .compose{margin-left:-40px;margin-right:-40px}
.phone.wide .scroll{padding-left:40px;padding-right:40px}
.phone.wide .h1{font-size:36px}
.phone.wide .cols{display:grid;grid-template-columns:1fr 1fr;align-content:start}
.col{display:flex;flex-direction:column;gap:14px}
.phone.wide .kbwrap{padding-left:16px;padding-right:16px}
.phone.wide .krow{gap:8px}
.phone.wide .key{max-width:58px;height:54px;font-size:24px}
.phone.wide .key.wide{max-width:84px}.phone.wide .key.fn{max-width:76px}.phone.wide .key.ret{max-width:150px}.phone.wide .key.space{max-width:330px}
.phone.wide .bub{max-width:60%}
.phone.small .key{max-width:37px}
.phone.small .key.wide{max-width:54px}.phone.small .key.fn{max-width:50px}.phone.small .key.ret{max-width:100px}.phone.small .key.space{max-width:214px}
/* text field and conversation */
.field{background:var(--card);border-radius:var(--r-md);padding:14px 16px;min-height:64px;font-size:18px;line-height:1.4;word-break:break-word}
.field .open{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:4px}
.field .caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:text-bottom;animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.prompt{font-size:15px;color:var(--muted);font-weight:700}
.prompt b{color:var(--ink);font-size:22px;display:block;margin-top:2px}
.convo{display:flex;flex-direction:column;gap:8px;flex:1;overflow:hidden}
.bub{max-width:78%;padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.35;background:var(--card)}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.compose{display:flex;gap:8px;align-items:flex-end;margin:0 -22px;padding:8px 14px;background:var(--bg)}
.compose .field{flex:1;min-height:44px;padding:9px 14px;border-radius:22px;border:1px solid var(--line);font-size:17px}
/* keyboard */
.kbwrap{margin:0 -22px;margin-top:auto;position:relative;background:var(--kb);padding:8px 4px 24px;user-select:none;-webkit-user-select:none}
.bar{display:flex;align-items:center;gap:6px;height:44px;padding:0 6px;margin-bottom:8px}
.bar button{font:inherit;font-weight:700;font-size:17px;border:0;background:transparent;color:var(--ink);flex:1;padding:8px 6px;border-radius:10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar button.top{background:var(--card);font-weight:900}
.bar .note{flex:1;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.bar .note b{color:var(--accent)}
.bar .fixlabel{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 4px;flex:none}
.bar .fix{flex:none;max-width:38%;display:flex;align-items:center;gap:4px;background:var(--ice);font-weight:800;padding:8px 10px}
.bar .fix .fixlabel{padding:0 2px 0 0}
.bar .sep{flex:none;width:1px;height:22px;background:var(--line)}
.bar button.next{color:var(--ink);font-weight:700}
.bar.fresh button.next{animation:nextin .25s ease-out}
@keyframes nextin{from{opacity:0;transform:translateY(4px)}}
.modes{display:flex;flex-direction:column;gap:2px}
.modes button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:9px;position:relative}
.krow{display:flex;justify-content:center;gap:6px}
.key{flex:1 1 0;min-width:0;max-width:33px;height:44px;border-radius:7px;background:var(--key);color:var(--key-ink);font:inherit;font-weight:700;font-size:21px;border:0;padding:0;display:grid;place-items:center;
  box-shadow:0 1px 0 rgba(0,0,0,.25);position:relative;transition:background .25s,color .25s,transform .15s var(--spring);touch-action:none}
.key.wide{flex:1.45 1 0;max-width:48px;background:var(--key-dark);font-size:15px}
.key.space{flex:5.7 1 0;max-width:190px;font-size:13px;font-weight:800;color:var(--muted)}
.key.fn{flex:1.33 1 0;max-width:44px;background:var(--key-dark);font-size:14px}
.key.ret{flex:2.66 1 0;max-width:88px;background:var(--key-dark);font-size:14px}
.key.hitL{background:var(--left);color:#fff;transform:scale(1.06)}
.key.hitR{background:var(--right);color:#fff;transform:scale(1.06)}
.key.hintL{box-shadow:0 0 0 3px var(--left)}
.key.hintR{box-shadow:0 0 0 3px var(--right)}
.trails{position:absolute;inset:0;pointer-events:none;overflow:visible}
.trails path{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.trails path.L{stroke:var(--left)}.trails path.R{stroke:var(--right)}
.trails path.done{animation:fade 1.2s ease-out forwards}
.trails circle{opacity:.9;animation:ping .6s ease-out forwards}
.trails circle.L{fill:var(--left)}.trails circle.R{fill:var(--right)}
@keyframes fade{to{opacity:0}}
@keyframes ping{from{r:6}to{r:22;opacity:0}}
.meter{display:flex;align-items:center;gap:10px}
.meter .track{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter .track i{display:block;height:100%;width:52%;background:linear-gradient(90deg,var(--left),var(--right));border-radius:5px;animation:grow 1s var(--spring)}
@keyframes grow{from{width:0}}
.wordcards{display:flex;gap:8px}
.wordcards div{flex:1;text-align:center;padding:12px 0;border-radius:var(--r-sm);background:var(--card);font-weight:900;font-size:18px}
.wordcards div.done{background:var(--mint);color:#fff}
.wordcards div.now{box-shadow:0 0 0 3px var(--accent)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<div class="stage">
  <nav class="picker" aria-label="Screens">
    <h1>Astrotype</h1>
    <p>Guess the next word: after each word the bar offers the likely next ones, so a tap writes "to" or "the" instead of a swipe. The keyboard works: type a word, then tap a next word. Guesses come from the real English word-pair model.</p>
    <small>Before and after</small>
    <button data-go="messages">12 · Messages, today (FIX)</button>
    <button data-go="nextMsg">12 · Messages, with next words</button>
    <button data-go="nextNew">New message (sentence start)</button>
    <button data-go="prefs">9 · Keyboard settings</button>
    <small>Bar after a word</small>
    <div class="modes" role="group" aria-label="Bar after a word">
      <button data-mode="A">A · Fix chip, then next words</button>
      <button data-mode="B">B · FIX, then next words after a beat</button>
      <button data-mode="C">C · Next words only (backspace to fix)</button>
    </div>
    <small>Size</small>
    <div class="sizes" role="group" aria-label="Size">
      <button data-size="small">Small</button><button data-size="">Phone</button><button data-size="wide">Wide</button>
    </div>
    <small>Theme</small>
    <div class="themes" role="group" aria-label="Theme">
      <button data-theme="">System</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button>
    </div>
  </nav>
  <div class="phone" id="phone" role="region" aria-label="Astrotype mockup"></div>
</div>

function isSub(w,path){let i=0;for(const c of path){if(c===w[i])i++;if(i===w.length)return true}return false}

    if(w.length<2||w[0]!==first||w[w.length-1]!==last||w.length>path.length)continue;
    if(!isSub(w,path))continue;

/* ---------- navigation ---------- */
function go(name,push=true){
  if(!screens[name])name="welcome";
  phone.innerHTML=screens[name]();
  picker.querySelectorAll("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===name));
  if(push)try{if(location.hash!=="#"+name)history.replaceState(null,"",location.pathname+location.search+"#"+name)}catch(e){}
  after[name]&&after[name]();
}
const after={
  enable(){document.getElementById("openSettings").onclick=()=>{S.on=true;go("enable",false);confetti()}},
  try(){kb=mountKB("kbTry",{field:"#tryField",autoCap:false,note:"Tap or swipe. Space writes the word.",onCommit:(w)=>{if(w==="something"){confetti();setTimeout(()=>go("home"),1400)}}});
    document.getElementById("showMe").onclick=()=>kb.replay(DEMO_SOMETHING);setTimeout(()=>kb&&kb.replay(DEMO_SOMETHING),900)},
  speed(){const target="the cat went to the store for some bread and came back with a hat".split(" ");let i=0;
    kb=mountKB("kbSpeed",{field:"#speedField",note:"Go!",onCommit:(w)=>{if(w===target[i]){i++;document.getElementById("speedDone").textContent=target.slice(0,i).join(" ")+" ";document.getElementById("speedLeft").textContent=target.slice(i).join(" ");if(i===target.length)go("result")}
      else document.getElementById("speedField").classList.add("shake"),setTimeout(()=>document.getElementById("speedField").classList.remove("shake"),400)}})},
  drill(){kb=mountKB("kbDrill",{field:"#drillField",note:"Left w→e, right n→t",onCommit:(w)=>{if(w==="went")confetti()}});kb.hint("w","L");kb.hint("e","L");kb.hint("n","R");kb.hint("t","R")},
  messages(){kb=mountKB("kbMsg",{field:"#msgField",text:"About twenty ",autoCap:true,note:"Both thumbs, one word"});kb.K.fix=["twenty","twenty","twelve"];kb.render()},
  nextMsg(){kb=mountKB("kbNext",{field:"#nextField",text:"About twenty ",autoCap:true,next:true,note:"Both thumbs, one word"});kb.K.fix=["twenty","twelve"];kb.render()},
  nextNew(){kb=mountKB("kbNew",{field:"#newField",text:"",autoCap:true,next:true,note:"Both thumbs, one word"})},
  free(){kb=mountKB("kbFree",{field:"#freeField",text:"Free mode ",autoCap:true,free:true,note:"One finger at a time"})},
  pro(){phone.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>{S.plan=b.dataset.plan;go("pro",false)})},
  prefs(){phone.querySelectorAll(".toggle[data-set]").forEach(t=>t.onclick=()=>{S[t.dataset.set]=!S[t.dataset.set];t.setAttribute("aria-pressed",S[t.dataset.set])})},
  result(){confetti()}
};
function confetti(){for(let i=0;i<18;i++){const f=document.createElement("div");f.className="fish";f.style.left=Math.random()*(phone.clientWidth-30)+"px";f.style.background=["var(--left)","var(--right)","var(--sun)","var(--mint)"][i%4];f.style.borderRadius="50% 0 50% 0";f.style.animationDelay=Math.random()*.6+"s";phone.appendChild(f);setTimeout(()=>f.remove(),3000)}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){go(b.dataset.go)}});
document.querySelectorAll(".themes button").forEach(b=>b.onclick=()=>{const t=b.dataset.theme;if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");document.querySelectorAll(".themes button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
document.querySelector('.themes button[data-theme=""]').setAttribute("aria-pressed","true");
document.querySelectorAll(".sizes button").forEach(b=>b.onclick=()=>{phone.className="phone "+b.dataset.size;document.querySelectorAll(".sizes button").forEach(x=>x.setAttribute("aria-pressed",x===b));go(location.hash.slice(1)||"welcome",false)});
document.querySelector('.sizes button[data-size=""]').setAttribute("aria-pressed","true");
document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;document.querySelectorAll(".modes button").forEach(x=>x.setAttribute("aria-pressed",x===b));const h=location.hash.slice(1);go(h==="nextNew"?h:"nextMsg",false)});
document.querySelector('.modes button[data-mode="A"]').setAttribute("aria-pressed","true");
window.addEventListener("hashchange",()=>go(location.hash.slice(1),false));
go((location.hash||"#nextMsg").slice(1),false);
</script>
