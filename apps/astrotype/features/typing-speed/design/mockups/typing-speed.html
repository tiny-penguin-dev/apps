<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astrotype Typing Speed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* One phone on a pale ice stage with a screen picker beside it. Tokens and components are Astrotype's (DESIGN.md "Design system"), same names as the other feature mockups. New: SpeedCard (Home's lead card), SpeedChart (everyday line + practice dots), StatTile. */
:root{
  --stage:#E6F0F4; --bg:#F3F8FA; --card:#FFFFFF; --ink:#1E2945; --muted:#67748F; --line:#DCE6EC;
  --accent:#139FB5; --accent-ink:#FFFFFF; --left:#139FB5; --right:#FF6F86; --sun:#FFC24D; --mint:#2FBF96; --ice:#D9EDF3;
  --font:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#0A1118; --bg:#111A24; --card:#1A2634; --ink:#EEF4F8; --muted:#97A6B8; --line:#2A3B4C;
  --accent:#2FC6DC; --accent-ink:#06202A; --left:#2FC6DC; --right:#FF8A9E; --sun:#FFCD66; --mint:#45D3AA; --ice:#1D3240; color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#0A1118; --bg:#111A24; --card:#1A2634; --ink:#EEF4F8; --muted:#97A6B8; --line:#2A3B4C;
  --accent:#2FC6DC; --accent-ink:#06202A; --left:#2FC6DC; --right:#FF8A9E; --sun:#FFCD66; --mint:#45D3AA; --ice:#1D3240; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding-block:24px;flex-wrap:wrap}
.picker{display:flex;flex-direction:column;gap:6px;max-width:260px;min-width:0}
.picker h1{font-size:28px;font-weight:900;margin:0}
.picker p{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.45}
.picker button{font-weight:700;font-size:14px;text-align:left;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:10px;cursor:pointer}
.picker button[aria-current="true"]{background:var(--card);color:var(--ink)}
.picker small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;margin-top:10px;padding-left:12px}
.picker button:focus-visible,.phone :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg-mini{display:flex;gap:4px;margin-top:4px;padding-left:8px;flex-wrap:wrap}
.seg-mini button{padding:5px 10px;font-size:12px;background:var(--line)}
.seg-mini button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.why{font-size:13px;color:var(--muted);line-height:1.45;background:var(--card);border-radius:12px;padding:10px 12px;margin-top:10px}
.phone{width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:48px;position:relative;overflow:hidden;
  box-shadow:0 0 0 10px var(--ink),0 30px 60px rgba(20,30,60,.25);flex:none}
.phone.small{width:375px;height:667px;border-radius:36px}
.phone.wide{width:744px;height:1024px;border-radius:40px}
@media (max-width:700px){.picker{max-width:100%;flex-direction:row;flex-wrap:wrap;align-items:center}.picker h1,.picker p,.why{width:100%}.picker small{display:none}
  .phone{box-shadow:none;border-radius:32px}.phone.wide{display:none}}
.status{position:absolute;top:14px;left:30px;right:30px;display:flex;justify-content:space-between;font-weight:800;font-size:15px;z-index:3}
.phone.small .status{top:8px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:54px 0 0}
.phone.small .screen{padding-top:34px}
.screen.anim{animation:in .4s var(--spring)}
@keyframes in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.nav{display:flex;align-items:center;padding:0 22px;height:40px;flex:none}
.back{font-weight:800;color:var(--accent);background:none;border:0;font-size:17px;padding:0;cursor:pointer}
.scroll{overflow-y:auto;flex:1;padding:0 22px 40px;display:flex;flex-direction:column;gap:12px}
.phone.small .scroll{padding:0 14px 30px}
.phone.wide .scroll{padding:0 40px 40px}
.h1{font-size:30px;font-weight:900;line-height:1.1;margin:4px 0 6px;text-wrap:balance}
.phone.small .h1{font-size:26px}
.sub{color:var(--muted);font-size:13px;line-height:1.4;margin:0}
.sec{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 -4px 6px}
.card{background:var(--card);border-radius:var(--r-md);padding:16px}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--ice);color:var(--ink);white-space:nowrap}
.chip.up{background:color-mix(in srgb,var(--mint) 22%,transparent)}
.chip.sun{background:color-mix(in srgb,var(--sun) 40%,transparent)}
.btn{font-weight:800;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:14px;padding:10px 16px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000 25%);transition:transform .25s var(--spring)}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;padding:8px}
.btn.wide{width:100%;font-size:17px;padding:15px}
.pro{font-size:10px;font-weight:900;letter-spacing:.08em;background:var(--sun);color:#3A2600;padding:3px 7px;border-radius:6px}
.big{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.mid{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.unit{font-weight:800;color:var(--muted);font-size:15px}
.seg{display:flex;background:var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;font-weight:800;font-size:14px;border:0;background:transparent;color:var(--muted);padding:8px 0;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
/* SpeedChart */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-weight:800;font-family:var(--font)}
.chart .every{fill:none;stroke:var(--left);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.chart .everyfill{fill:color-mix(in srgb,var(--left) 14%,transparent)}
.chart .pdot{fill:var(--right);stroke:var(--card);stroke-width:2}
.chart .gap{stroke:var(--muted);stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round;fill:none;opacity:.6}
.chart .sel{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}
.chart .hit{fill:transparent;cursor:pointer}
.chart.draw .every{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;gap:14px;font-size:12px;font-weight:800;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tip{background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;line-height:1.35}
.tip b{font-weight:900}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phone.wide .tiles{grid-template-columns:repeat(4,1fr)}
.tile{background:var(--card);border-radius:var(--r-md);padding:12px 14px}
.tile b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12px;font-weight:800}
.group{background:var(--card);border-radius:var(--r-md);overflow:hidden}
.group>.r+.r{border-top:1px solid var(--line)}
.r{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:52px;width:100%;color:inherit;text-align:left;background:none;border:0}
button.r{cursor:pointer}
.r .t{flex:1;min-width:0}
.r .t b{display:block;font-size:16px;font-weight:800}
.r .t span{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:1px}
.r .val{color:var(--muted);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.r.danger .t b{color:#E0526A}
.chev{color:var(--muted);font-weight:900;font-size:18px}
.toggle{width:52px;height:32px;border-radius:999px;background:var(--mint);border:0;position:relative;flex:none;padding:0;cursor:pointer}
.toggle::after{content:"";position:absolute;top:3px;left:23px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .3s var(--spring)}
.toggle[aria-pressed="false"]{background:var(--line)}.toggle[aria-pressed="false"]::after{left:3px}
.week{display:flex;justify-content:space-between}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.week i{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;color:#fff}
.week i.y{background:var(--mint)}
.badge{width:28px;height:28px;border-radius:50%;background:var(--ice);display:grid;place-items:center;font-weight:900;flex:none}
.badge.done{background:var(--mint);color:#fff}
.cols{display:flex;flex-direction:column;gap:12px}
.phone.wide .cols{flex-direction:row;align-items:flex-start;gap:24px}
.phone.wide .cols>.col{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
.note{color:var(--muted);font-size:13px;line-height:1.45;margin:2px 6px 0}
.note a{color:var(--accent);font-weight:800;text-decoration:none}
.prompt{font-size:19px;line-height:1.5;font-weight:700}
.prompt .done{color:var(--mint)}
.field{min-height:44px;padding:10px 14px;border-radius:22px;border:1px solid var(--line);font-size:17px;background:var(--card)}
.ring{width:120px;height:120px;margin:0 auto}
.empty{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:28px 10px}
.empty .ic{width:56px;height:56px;border-radius:18px;background:var(--ice);display:grid;place-items:center}
.empty .ic svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.screen.anim,.chart.draw .every{animation:none;stroke-dasharray:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="picker" role="navigation" aria-label="Screens">
    <h1>Typing speed</h1>
    <p>Your everyday speed, measured in every app, and practice that measures you against it. Tap through, or tap the chart.</p>
    <small>Home</small>
    <button data-s="before">Home today (before)</button>
    <button data-s="home">Home with Your speed</button>
    <button data-s="homeNew">Home, first days</button>
    <button data-s="homeOff">Home, no Full Access</button>
    <small>Your speed</small>
    <button data-s="week">Week</button>
    <button data-s="month">Month</button>
    <button data-s="year">Year</button>
    <small>Practice</small>
    <button data-s="test">Speed practice</button>
    <button data-s="result">Result vs everyday</button>
    <small>Settings</small>
    <button data-s="privacy">Privacy and sharing</button>
    <small>Look</small>
    <div class="seg-mini" id="sizes"><button data-size="">iPhone</button><button data-size="small">Small</button><button data-size="wide">Wide</button></div>
    <div class="seg-mini" id="themes"><button data-theme="light">Light</button><button data-theme="dark">Dark</button></div>
    <div class="why" id="why"></div>
  </div>
  <div class="phone" id="phone"></div>
</div>
<script>
// ---- made-up data: 365 days of everyday speed (median of qualifying runs), some days empty, plus practice results
function rnd(seed){let s=seed;return()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,((s^s>>>14)>>>0)/4294967296))}
const R=rnd(42);
const TODAY=new Date(2026,10,8);
const days=[];
for(let i=364;i>=0;i--){
  const d=new Date(TODAY);d.setDate(d.getDate()-i);
  const t=(364-i)/364; // learning curve: 31 -> 46
  const base=31+15*(1-Math.pow(1-t,2));
  const empty=R()<0.12;
  const wpm=empty?null:Math.round(base+(R()-.5)*7);
  const runs=empty?0:3+Math.floor(R()*20);
  const prac=R()<0.18?Math.round(base+6+(R()-.3)*8):null;
  days.push({d,wpm,runs,prac,words:runs*(14+Math.floor(R()*22))});
}
const fmtDay=d=>d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const S={screen:"home",size:"",theme:"light",sel:null};
const WHY={
  before:"Home today: the speed test card leads, and it only knows the test.",
  home:"Your speed leads Home. The big number is your everyday speed over the last 7 days. The line is everyday typing in every app, the coral dots are practice. Practice for speed starts the test; tap the card for the history.",
  homeNew:"Until there are 3 days with enough typing, the card says how far along it is instead of showing a shaky number.",
  homeOff:"Without Full Access the keyboard can't hand the app anything, so the card asks for it. Practice still works and still shows on the chart.",
  week:"Each day's speed is the median of that day's runs: stretches of at least 10 words without a 5-second pause. Short replies don't count, and the median ignores the odd very fast or very slow run. Tap a day for its numbers.",
  month:"Days with too little typing are left as a gap in the line (a dotted bridge), never as zero.",
  year:"A year is drawn by week (the median of that week's days) so the line stays readable.",
  test:"Speed practice is the old speed test, renamed and moved under Your speed. Same three sentences.",
  result:"The result compares the practice speed with your everyday speed, which is the number people actually care about.",
  privacy:"A switch to stop counting, and a way to delete the history. On by default, on this iPhone only."
};
const status=()=>`<div class="status"><span>9:41</span><span>●●● ⌁ ▮</span></div>`;
const icon={bolt:`<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>`,lock:`<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`};

function median(a){a=a.filter(x=>x!=null).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:Math.round((a[m-1]+a[m])/2)}
function series(range){
  if(range==="week")return days.slice(-7).map(x=>({label:x.d.toLocaleDateString("en-US",{weekday:"narrow"}),day:x,v:x.wpm,p:x.prac}));
  if(range==="month")return days.slice(-30).map((x,i)=>({label:i%7===0?String(x.d.getDate()):"",day:x,v:x.wpm,p:x.prac}));
  const out=[];for(let i=days.length-364;i<days.length;i+=7){const w=days.slice(i,i+7);out.push({label:w[0].d.getDate()<=7?w[0].d.toLocaleDateString("en-US",{month:"narrow"}):"",week:w,v:median(w.map(x=>x.wpm)),p:Math.max(...w.map(x=>x.prac||0))||null})}
  return out;
}
function chart(range,h,opts={}){
  const pts=series(range),W=320,H=h,padL=opts.mini?4:26,padB=opts.mini?6:20,padT=opts.mini?6:8;
  const all=pts.flatMap(p=>[p.v,p.p]).filter(x=>x!=null);
  const lo=opts.mini?Math.min(...all)-2:Math.floor((Math.min(...all)-4)/10)*10,hi=opts.mini?Math.max(...all)+2:Math.ceil((Math.max(...all)+2)/10)*10;
  const x=i=>padL+(W-padL-6)*(pts.length===1?.5:i/(pts.length-1));
  const y=v=>padT+(H-padT-padB)*(1-(v-lo)/(hi-lo));
  let grid="";if(!opts.mini)for(let g=lo;g<=hi;g+=10){grid+=`<line class="grid" x1="${padL}" x2="${W}" y1="${y(g)}" y2="${y(g)}"/>${opts.mini?"":`<text class="axis" x="0" y="${y(g)+4}">${g}</text>`}`}
  // line segments split at gaps, with a dotted bridge over gaps
  let segs=[],cur=[],bridges="",last=null;
  pts.forEach((p,i)=>{if(p.v==null){if(cur.length)segs.push(cur);cur=[]}else{if(last&&last.i<i-1)bridges+=`<path class="gap" d="M${x(last.i)},${y(last.v)}L${x(i)},${y(p.v)}"/>`;cur.push([x(i),y(p.v)]);last={i,v:p.v}}});
  if(cur.length)segs.push(cur);
  const line=segs.map(s=>s.length===1?`<circle cx="${s[0][0]}" cy="${s[0][1]}" r="3" fill="var(--left)"/>`:`<path class="every" d="M${s.map(q=>q.join(",")).join("L")}"/>`).join("");
  const dots=pts.map((p,i)=>p.p?`<circle class="pdot" cx="${x(i)}" cy="${y(p.p)}" r="${opts.mini?4:5}"/>`:"").join("");
  const labels=opts.mini?"":pts.map((p,i)=>p.label?`<text class="axis" x="${x(i)}" y="${H-4}" text-anchor="middle">${p.label}</text>`:"").join("");
  const sel=S.sel!=null&&S.sel<pts.length&&!opts.mini?`<line class="sel" x1="${x(S.sel)}" x2="${x(S.sel)}" y1="${padT}" y2="${H-padB}"/>`:"";
  const hits=opts.mini?"":pts.map((p,i)=>`<rect class="hit" data-i="${i}" x="${x(i)-(W/pts.length)/2}" y="0" width="${W/pts.length}" height="${H}"><title>${tipText(p)}</title></rect>`).join("");
  return `<div class="chart draw"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Everyday speed ${range==="year"?"by week":"by day"}, with practice results">${grid}${bridges}${line}${dots}${labels}${sel}${hits}</svg></div>`;
}
function tipText(p){
  if(p.week)return `Week of ${fmtDay(p.week[0].d)}: ${p.v??"no"} wpm everyday${p.p?`, practice best ${p.p}`:""}`;
  return `${fmtDay(p.day.d)}: ${p.v==null?"not enough typing":p.v+" wpm everyday"}${p.p?`, practice ${p.p}`:""}`;
}
function tip(range){
  const pts=series(range);if(S.sel==null||S.sel>=pts.length)return `<p class="sub" style="text-align:center">Tap the chart for a day's numbers.</p>`;
  const p=pts[S.sel];
  if(p.week)return `<div class="tip"><b>Week of ${fmtDay(p.week[0].d)}</b><br>${p.v??"–"} wpm everyday${p.p?` · practice best ${p.p}`:""}</div>`;
  return `<div class="tip"><b>${fmtDay(p.day.d)}</b><br>${p.v==null?"Not enough typing to count":`${p.v} wpm everyday · ${p.day.runs} runs · ${p.day.words.toLocaleString()} words`}${p.p?`<br>Practice ${p.p} wpm`:""}</div>`;
}
const last7=median(days.slice(-7).map(x=>x.wpm)), prev7=median(days.slice(-14,-7).map(x=>x.wpm));
const bestPrac=Math.max(...days.map(x=>x.prac||0));
const legend=`<div class="legend"><span><i style="background:var(--left)"></i>Everyday</span><span><i style="background:var(--right)"></i>Practice</span></div>`;

function speedCard(kind){
  if(kind==="off")return `<div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="row"><b style="font-size:17px">Your speed</b><span class="spacer"></span><span class="chip">Best practice ${bestPrac}</span></div>
    <p class="sub" style="font-size:15px">Turn on Full Access and Astrotype measures how fast you type everywhere, not just here. Only counts and times, never what you type.</p>
    <div class="row"><button class="btn" data-go="test">Practice for speed</button><button class="btn ghost">Turn on ›</button></div></div>`;
  if(kind==="new")return `<div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="row"><b style="font-size:17px">Your speed</b><span class="spacer"></span><span class="chip">Day 1 of 3</span></div>
    <p class="sub" style="font-size:15px">Type as you normally do. After three days with a few longer messages, your everyday speed shows up here.</p>
    <div class="row"><button class="btn" data-go="test">Practice for speed</button></div></div>`;
  return `<button class="card" data-go="week" style="display:flex;flex-direction:column;gap:10px;border:0;text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit">
    <div class="row"><b style="font-size:17px">Your speed</b><span class="spacer"></span><span class="chip up">▲ ${last7-prev7} this week</span></div>
    <div class="row" style="align-items:flex-end;gap:8px"><span class="big">${last7}</span><span class="unit" style="padding-bottom:6px">words per minute,<br>everyday typing</span></div>
    ${chart("month",70,{mini:true})}
    <div class="row" style="justify-content:space-between">${legend}<span class="chev">›</span></div>
  </button>
  <div class="row" style="gap:10px"><button class="btn" data-go="test" style="flex:1">Practice for speed</button><span class="chip sun">Best ${bestPrac}</span></div>`;
}
const drills=`<div class="sec">Drills</div>
  <div class="card row"><span class="badge done">✓</span><div style="flex:1"><b>Two-letter swipes</b><div class="sub">th, in, er, on</div></div></div>
  <div class="card row"><span class="badge">2</span><div style="flex:1"><b>Switching thumbs</b><div class="sub">Start left, finish right</div></div><span class="chev">›</span></div>
  <div class="card row"><span class="badge">3</span><div style="flex:1"><b>Doubled letters</b><div class="sub">A tap inside a swipe</div></div><span class="chev">›</span></div>
  <div class="sec">This week</div>
  <div class="card week">${["M","T","W","T","F","S","S"].map((d,i)=>`<div><i class="${i<5?"y":""}">${i<5?"✓":""}</i>${d}</div>`).join("")}</div>
  <div class="card row"><div style="flex:1"><b>Settings</b><div class="sub">Autospace, gestures, trails, sync</div></div><span class="chev">›</span></div>`;
const proRow=`<div class="card row"><div style="flex:1"><b>Pro trial</b><div class="sub">11 days left. Two-thumb typing, gestures, layouts.</div></div><span class="pro">PRO</span></div>`;
const header=`<div class="row" style="margin-top:6px"><h1 class="h1">Both<br>flippers, go.</h1><span class="spacer"></span><svg width="64" height="64" viewBox="0 0 200 200" aria-hidden="true"><rect x="20" y="70" width="160" height="90" rx="18" fill="var(--card)" stroke="var(--line)" stroke-width="6"/><path d="M45 130 Q70 80 95 115" stroke="var(--left)" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M110 125 Q135 75 160 110" stroke="var(--right)" stroke-width="10" fill="none" stroke-linecap="round"/></svg></div>`;
function home(kind){
  return `<div class="scroll">${header}<div class="cols"><div class="col">${speedCard(kind)}${proRow}</div><div class="col">${drills}</div></div></div>`;
}
function history(range){
  const rng={week:"Last 7 days",month:"Last 30 days",year:"Last 12 months"}[range];
  const sl=range==="week"?days.slice(-7):range==="month"?days.slice(-30):days;
  const words=sl.reduce((a,x)=>a+(x.wpm?x.words:0),0);
  const fastest=Math.max(...sl.map(x=>x.wpm||0))+9;
  const pr=sl.filter(x=>x.prac).length;
  return `<div class="nav"><button class="back" data-go="home">‹ Home</button></div>
  <div class="scroll">
    <h1 class="h1">Your speed</h1>
    <div class="row" style="align-items:flex-end;gap:8px"><span class="big">${median(sl.map(x=>x.wpm))}</span><span class="unit" style="padding-bottom:6px">words per minute<br>${rng.toLowerCase()}</span><span class="spacer"></span><span class="chip up">▲ ${last7-prev7}</span></div>
    <div class="seg" role="group" aria-label="Range">${["week","month","year"].map(r=>`<button data-go="${r}" aria-pressed="${r===range}">${r[0].toUpperCase()+r.slice(1)}</button>`).join("")}</div>
    <div class="card" style="display:flex;flex-direction:column;gap:10px">${chart(range,180)}${legend}</div>
    ${tip(range)}
    <div class="tiles">
      <div class="tile"><b>${median(sl.map(x=>x.wpm))}</b><span>Everyday</span></div>
      <div class="tile"><b>${bestPrac}</b><span>Best practice</span></div>
      <div class="tile"><b>${fastest}</b><span>Fastest run</span></div>
      <div class="tile"><b>${words>=10000?Math.round(words/1000)+"k":words.toLocaleString()}</b><span>Words counted</span></div>
    </div>
    <button class="btn wide" data-go="test">Practice for speed</button>
    <p class="note">Counted whenever you type with Astrotype, in any app. A run counts once it has 10 words without a 5-second pause, so quick replies don't drag it down, and each day is the middle run (the median), so one odd run can't swing it. Passwords and private fields are never counted. Only counts and times are kept, on this iPhone. <a href="#" data-go="privacy">Privacy and sharing ›</a></p>
  </div>`;
}
const SCREENS={
  before:()=>`<div class="scroll">${header}<div class="cols"><div class="col"><div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="row"><b style="font-size:17px">Speed test</b><span class="spacer"></span><span class="chip">Best 47 wpm</span></div>
    <div class="row"><span class="sub">Apple 31</span><div style="flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden"><i style="display:block;height:100%;width:66%;background:linear-gradient(90deg,var(--left),var(--right))"></i></div><span class="sub">You 47</span></div>
    <div class="row"><button class="btn">Take the test</button><button class="btn ghost">Practice</button></div></div>${proRow}</div><div class="col">${drills}</div></div></div>`,
  home:()=>home("on"), homeNew:()=>home("new"), homeOff:()=>home("off"),
  week:()=>history("week"), month:()=>history("month"), year:()=>history("year"),
  test:()=>`<div class="nav"><button class="back" data-go="week">‹ Your speed</button><span class="spacer"></span><span class="chip">0:14</span></div>
   <div class="scroll"><h1 class="h1">Speed practice</h1><p class="sub" style="font-size:15px">Three sentences. Your everyday speed is ${last7}.</p>
   <div class="prompt"><span class="done">the cat went to the store </span>for some bread and came back with a hat</div>
   <div class="field">the cat went to the store <span style="display:inline-block;width:2px;height:20px;background:var(--accent);vertical-align:-4px"></span></div>
   <p class="sub" style="text-align:center">(the keyboard sits here)</p></div>`,
  result:()=>`<div class="nav"><button class="back" data-go="home">‹ Home</button></div>
   <div class="scroll" style="text-align:center;align-items:center">
   <svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="62" fill="var(--sun)"/><path d="M108 52 72 110h28l-8 40 36-58h-28z" fill="#3A2600"/></svg>
   <div class="big">57</div><div class="unit">words per minute</div>
   <p class="sub" style="font-size:16px;max-width:300px">11 faster than your everyday ${last7}. 2 words needed a fix.</p>
   <div class="card" style="width:100%;text-align:left;display:flex;flex-direction:column;gap:8px"><div class="row"><b>Practice vs everyday</b><span class="spacer"></span><span class="chip sun">New best</span></div>${chart("month",110,{mini:true})}${legend}</div>
   <div class="row" style="width:100%;gap:10px"><button class="btn" data-go="test" style="flex:1">Again</button><button class="btn ghost" data-go="home">Done</button></div></div>`,
  privacy:()=>`<div class="nav"><button class="back" data-go="week">‹ Settings</button></div>
   <div class="scroll"><h1 class="h1">Privacy and sharing</h1>
   <div class="sec">Typing speed</div>
   <div class="group"><div class="r"><div class="t"><b>Measure my speed</b><span>Everywhere you type with Astrotype. Counts and times only, kept on this iPhone.</span></div><button class="toggle" aria-pressed="true" aria-label="Measure my speed" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true')"></button></div>
   <button class="r danger"><div class="t"><b>Delete speed history</b></div></button></div>
   <p class="note">Practice results stay; they're in Practice history.</p>
   <div class="sec">Sharing</div>
   <div class="group"><div class="r"><div class="t"><b>Share anonymous usage data</b><span>Crash reports and counts, like your daily speed as a number. Never what you type.</span></div><button class="toggle" aria-pressed="true" aria-label="Share anonymous usage data"></button></div></div></div>`
};
const phone=document.getElementById("phone");
function render(anim=true){
  phone.className="phone "+S.size;
  document.documentElement.dataset.theme=S.theme;
  phone.innerHTML=status()+`<div class="screen ${anim?"anim":""}">${SCREENS[S.screen]()}</div>`;
  document.querySelectorAll(".picker [data-s]").forEach(b=>b.setAttribute("aria-current",b.dataset.s===S.screen));
  document.querySelectorAll("#sizes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.size===S.size));
  document.querySelectorAll("#themes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.theme===S.theme));
  document.getElementById("why").textContent=WHY[S.screen];
}
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-s]");if(s){S.screen=s.dataset.s;S.sel=null;render();return}
  const z=e.target.closest("[data-size]");if(z){S.size=z.dataset.size;render(false);return}
  const t=e.target.closest("[data-theme]");if(t){S.theme=t.dataset.theme;render(false);return}
  const h=e.target.closest(".hit");if(h){S.sel=+h.dataset.i;render(false);return}
  const g=e.target.closest("[data-go]");if(g){e.preventDefault();S.screen=g.dataset.go;S.sel=null;render();}
});
const q=new URLSearchParams(location.search);
if(q.get("s"))S.screen=q.get("s");if(q.get("size"))S.size=q.get("size");if(q.get("theme"))S.theme=q.get("theme");if(q.get("sel"))S.sel=+q.get("sel");
render();
</script>
</body>
</html>
