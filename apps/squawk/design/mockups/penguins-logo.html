<title>Squawk Logo Penguins</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: option cards; each shows the penguin as an app icon (light + dark tile) and in five moods. */
:root{
  --bg:#F2F4F7; --card:#FFFFFF; --ink:#0F1B2D; --muted:#5E6A80; --line:#E1E5EC; --tile:#EEF2F8;
  --navy:#0F1B2D; --beak:#FFB020; --cheek:#FF9CA6; --white:#FFFFFF; --peng:#0F1B2D;
  --font:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif; --spring:cubic-bezier(.34,1.56,.64,1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --card:#141E33; --ink:#EEF2FA; --muted:#97A2B8; --line:#25314B; --tile:#1D2944; --peng:#33466F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --card:#141E33; --ink:#EEF2FA; --muted:#97A2B8; --line:#25314B; --tile:#1D2944; --peng:#33466F; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:900px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
h1{font-size:34px;font-weight:900;margin:0}
.lead{color:var(--muted);font-size:16px;line-height:1.5;margin:0;max-width:62ch}
.opt{background:var(--card);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tag{font-weight:900;font-size:13px;letter-spacing:.06em;color:var(--navy);background:var(--beak);border-radius:8px;padding:3px 9px}
.head h2{margin:0;font-size:22px;font-weight:900}
.opt p{margin:0;color:var(--muted);line-height:1.45;max-width:65ch}
.grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:stretch}
.icons{display:flex;flex-direction:column;gap:10px}
.icon{width:96px;height:96px;border-radius:22px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(15,27,45,.12)}
.icon svg{width:74px;height:74px}
.icon.l{background:#FFFFFF}.icon.d{background:#0F1B2D}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mood{background:var(--tile);border-radius:18px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.mood svg{width:100%;max-width:130px;height:auto}
.mood b{font-size:12px;color:var(--muted)}
.notes{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.notes div{flex:1 1 220px;min-width:0}
.notes b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:640px){.grid{grid-template-columns:1fr}.icons{flex-direction:row}.moods{grid-template-columns:repeat(3,minmax(0,1fr))}}
.b{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 94%;transform-box:view-box}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
.hop{animation:hop .7s var(--spring) infinite alternate;transform-box:view-box}
@keyframes hop{to{transform:translateY(-9px)}}
.shout{animation:shout .5s ease-in-out infinite alternate;transform-box:view-box;transform-origin:50% 94%}
@keyframes shout{to{transform:rotate(-4deg) scale(1.03)}}
.zz{font-weight:900;fill:var(--muted);animation:zz 2.6s ease-in infinite;opacity:0;font-family:var(--font)}
.zz2{animation-delay:1.3s}
@keyframes zz{30%{opacity:1}100%{opacity:0;transform:translate(14px,-30px)}}
.lines{animation:lines .5s ease-in-out infinite alternate}
@keyframes lines{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<main>
  <h1>Logo-friendly penguins</h1>
  <p class="lead">These start from your Tiny Penguin mark: the arch body, side beak and golden accent. Each adds just enough face to act and emote, while still working as a flat app icon. Shown as an icon on light and dark, then in five moods. The last mood, Squawk!, is the alarm going off.</p>
  <div id="list" style="display:flex;flex-direction:column;gap:20px"></div>
</main>

<script>
const NAVY="#0F1B2D", BEAK="var(--beak)", CHEEK="var(--cheek)";
const zz=`<text class="zz" x="150" y="44" font-size="22">z</text><text class="zz zz2" x="162" y="30" font-size="16">z</text>`;
const lines=`<g class="lines" stroke="${BEAK}" stroke-width="5" stroke-linecap="round"><path d="M178 66 l12 -8"/><path d="M182 88 l14 0"/><path d="M178 110 l12 8"/></g>`;
const shadow=`<ellipse cx="100" cy="192" rx="50" ry="6" fill="rgba(15,27,45,.12)"/>`;

/* Profile eye on a dark body (white eye) */
function sideEye(m,x,y,body,r=11){
  if(m==="sleep")return `<path d="M${x-9} ${y} q9 7 18 0" stroke="var(--eye,#fff)" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(m==="proud")return `<path d="M${x-9} ${y+3} q9 -10 18 0" stroke="var(--eye,#fff)" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(m==="grumpy")return `<circle cx="${x}" cy="${y}" r="${r}" fill="var(--eye,#fff)"/><circle cx="${x+3}" cy="${y+3}" r="${r*.45}" fill="var(--pupil,#0F1B2D)"/><path d="M${x-r-2} ${y-r-3} L${x+r+2} ${y-2} L${x+r+2} ${y-r-6} Z" fill="${body}"/>`;
  if(m==="squawk")return `<circle cx="${x}" cy="${y}" r="${r+2}" fill="var(--eye,#fff)"/><circle cx="${x+2}" cy="${y}" r="${r*.35}" fill="var(--pupil,#0F1B2D)"/>`;
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="var(--eye,#fff)"/><circle cx="${x+3}" cy="${y}" r="${r*.5}" fill="var(--pupil,#0F1B2D)"/><circle cx="${x+5}" cy="${y-3}" r="2" fill="var(--eye,#fff)"/>`}
/* Front eyes on a white face (dark eyes) */
function frontEyes(m,lx,rx,y){const c="var(--feye,#0F1B2D)";
  if(m==="sleep")return `<path d="M${lx-8} ${y} q8 6 16 0 M${rx-8} ${y} q8 6 16 0" stroke="${c}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  if(m==="proud")return `<path d="M${lx-8} ${y+2} q8 -9 16 0 M${rx-8} ${y+2} q8 -9 16 0" stroke="${c}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  if(m==="grumpy")return `<path d="M${lx-9} ${y-8} l16 5 M${rx+9} ${y-8} l-16 5" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/><circle cx="${lx}" cy="${y+3}" r="5" fill="${c}"/><circle cx="${rx}" cy="${y+3}" r="5" fill="${c}"/>`;
  if(m==="squawk")return `<circle cx="${lx}" cy="${y}" r="8" fill="none" stroke="${c}" stroke-width="4"/><circle cx="${rx}" cy="${y}" r="8" fill="none" stroke="${c}" stroke-width="4"/><circle cx="${lx}" cy="${y}" r="3" fill="${c}"/><circle cx="${rx}" cy="${y}" r="3" fill="${c}"/>`;
  return `<circle cx="${lx}" cy="${y}" r="6.5" fill="${c}"/><circle cx="${rx}" cy="${y}" r="6.5" fill="${c}"/><circle cx="${lx+2}" cy="${y-2}" r="2" fill="#fff"/><circle cx="${rx+2}" cy="${y-2}" r="2" fill="#fff"/>`}
function sideBeak(m,x,y,s=1){
  if(m==="squawk")return `<path d="M${x} ${y-12*s} L${x+30*s} ${y-16*s} L${x} ${y-2*s} Z" fill="${BEAK}"/><path d="M${x} ${y+2*s} L${x+24*s} ${y+18*s} L${x} ${y+12*s} Z" fill="${BEAK}"/>`;
  return `<path d="M${x} ${y-10*s} L${x+26*s} ${y} L${x} ${y+10*s} Z" fill="${BEAK}"/>`}
const wrap=(m,inner,extra="")=>`<g class="${m==="proud"?"hop":m==="squawk"?"shout":""}"><g class="b">${inner}</g></g>${m==="sleep"?zz:""}${m==="squawk"?extra:""}`;

const OPTIONS=[
{id:"E",name:"The mark, with a face",
 about:"Your logo almost exactly: arch body, belly window and side beak. It gains a real eye with a pupil, a blush, golden feet and a flipper. The closest to the brand mark, so the logo and the mascot are the same penguin.",
 good:"One character for brand and app. Strong, simple silhouette at any size.",watch:"Side view only, so fewer expressions than a front face.",
 draw:(m,b="var(--peng)",w="#fff",icon)=>wrap(m,`
  ${icon?"":`<ellipse cx="44" cy="140" rx="11" ry="26" fill="${b}" transform="rotate(${m==="proud"||m==="squawk"?40:14} 44 140)"/>`}
  <path d="M54 186 V92 A46 46 0 0 1 146 92 V186 Z" fill="${b}"/>
  <path d="M68 186 V140 A30 30 0 0 1 128 140 V186 Z" fill="${w}"/>
  <path d="M88 186 V174 A10 10 0 0 1 108 174 V186 Z" fill="${b}"/>
  ${sideEye(m,112,88,b)}${icon?"":`<circle cx="128" cy="110" r="6" fill="${CHEEK}" opacity=".85"/>`}
  ${sideBeak(m,145,94)}
  ${icon?"":`<ellipse cx="78" cy="189" rx="13" ry="5" fill="${BEAK}"/><ellipse cx="118" cy="189" rx="13" ry="5" fill="${BEAK}"/>`}`,lines)},

{id:"F",name:"Front-facing arch",
 about:"The same arch shape seen from the front: a white face-and-belly arch, two eyes, a small golden beak and stubby flippers. Still reads as the logo shape from far away, but up close it can make every face.",
 good:"Most expressive while keeping the logo's geometry. Great for reactions.",watch:"Drifts a bit from the side-beak logo; the icon needs its own version.",
 draw:(m,b="var(--peng)",w="#fff",icon)=>wrap(m,`
  <rect x="${icon?36:30}" y="118" width="22" height="46" rx="11" fill="${b}" transform="rotate(${m==="proud"||m==="squawk"?28:10} 41 120)"/>
  <rect x="${icon?142:148}" y="118" width="22" height="46" rx="11" fill="${b}" transform="rotate(${m==="proud"||m==="squawk"?-28:-10} 159 120)"/>
  <path d="M50 186 V96 A50 50 0 0 1 150 96 V186 Z" fill="${b}"/>
  <path d="M64 186 V108 A36 36 0 0 1 136 108 V186 Z" fill="${w}"/>
  <path d="M90 186 V176 A10 10 0 0 1 110 176 V186 Z" fill="${b}"/>
  ${frontEyes(m,86,114,110)}
  ${m==="squawk"?`<path d="M88 122 L112 122 L100 132Z" fill="${BEAK}"/><path d="M90 136 L110 136 L100 146Z" fill="${BEAK}"/>`:`<path d="M90 122 L110 122 L100 134Z" fill="${BEAK}"/>`}
  ${icon?"":`<circle cx="76" cy="126" r="6" fill="${CHEEK}" opacity=".85"/><circle cx="124" cy="126" r="6" fill="${CHEEK}" opacity=".85"/>
  <ellipse cx="80" cy="189" rx="13" ry="5" fill="${BEAK}"/><ellipse cx="120" cy="189" rx="13" ry="5" fill="${BEAK}"/>`}`,
  `<g class="lines" stroke="${BEAK}" stroke-width="5" stroke-linecap="round"><path d="M160 64 l12 -10"/><path d="M40 64 l-12 -10"/><path d="M100 28 v-14"/></g>`)},

{id:"G",name:"Big and tiny",
 about:"Your logo's hidden detail, turned into the story: the big Tiny Penguin carries a little chick in its belly window, and the chick is Squawk. The big one stays calm like a logo; the chick does all the acting, and can hop out in the app.",
 good:"Ties every app to the brand: each app can have its own chick. Charming story.",watch:"Two characters; the chick is small in the icon, so it needs a simple face.",
 draw:(m,b="var(--peng)",w="#fff",icon)=>{const up=m==="proud"?-8:m==="squawk"?-4:0;return `
  <path d="M46 186 V90 A50 50 0 0 1 146 90 V186 Z" fill="${b}"/>
  <circle cx="108" cy="82" r="9" fill="var(--eye,#fff)"/>${sideBeak("x",145,88)}
  <path d="M58 186 V128 A38 38 0 0 1 134 128 V186 Z" fill="${w}"/>
  <g class="${m==="proud"?"hop":m==="squawk"?"shout":""}"><g class="b" transform="translate(0 ${up})">
   <path d="M76 186 V150 A20 20 0 0 1 116 150 V186 Z" fill="${b}"/>
   ${sideEye(m,102,150,b,6.5)}
   ${sideBeak(m,115,156,.6)}
   ${icon?"":`<circle cx="108" cy="166" r="3.5" fill="${CHEEK}"/>`}
  </g></g>
  ${m==="sleep"?`<text class="zz" x="120" y="132" font-size="16">z</text><text class="zz zz2" x="128" y="122" font-size="12">z</text>`:""}
  ${m==="squawk"?`<g class="lines" stroke="${BEAK}" stroke-width="3.5" stroke-linecap="round"><path d="M136 146 l8 -6"/><path d="M138 158 h10"/><path d="M136 170 l8 6"/></g>`:""}`}},

{id:"H",name:"Pebble",
 about:"A softer take: the arch becomes a round pebble with a tilted belly, like a real penguin in profile, but still one clean shape. Rounder and cuddlier than the logo, while keeping the side beak and golden accent.",
 good:"Cuddliest of the logo-based options. Squash and stretch look natural.",watch:"Furthest from the current mark; the logo would get a little rounder too.",
 draw:(m,b="var(--peng)",w="#fff",icon)=>wrap(m,`
  ${icon?"":`<ellipse cx="62" cy="134" rx="12" ry="30" fill="${b}" transform="rotate(${m==="proud"||m==="squawk"?36:12} 62 134)"/>`}
  <path d="M100 40 C138 40 156 74 156 116 C156 162 134 188 100 188 C64 188 46 164 46 124 C46 76 64 40 100 40Z" fill="${b}"/>
  <path d="M146 96 C160 128 152 178 108 182 C84 184 72 170 76 150 C82 120 118 112 146 96Z" fill="${w}"/>
  ${sideEye(m,118,82,b,10)}
  ${icon?"":`<circle cx="136" cy="104" r="6" fill="${CHEEK}" opacity=".85"/>`}
  ${sideBeak(m,152,90)}
  ${icon?"":`<ellipse cx="88" cy="190" rx="13" ry="5" fill="${BEAK}"/><ellipse cx="124" cy="190" rx="13" ry="5" fill="${BEAK}"/>`}`,lines)}
];
const MOODS=[["sleep","Asleep"],["awake","Awake"],["proud","Proud"],["grumpy","Grumpy"],["squawk","Squawk!"]];
const svg=(inner,label,st="")=>`<svg viewBox="0 0 200 200" role="img" aria-label="${label}" style="${st}">${inner}</svg>`;
document.getElementById("list").innerHTML=OPTIONS.map(o=>`<section class="opt" aria-labelledby="h${o.id}">
  <div class="head"><span class="tag">${o.id}</span><h2 id="h${o.id}">${o.name}</h2></div>
  <p>${o.about}</p>
  <div class="grid">
    <div class="icons"><div class="icon l">${svg(o.draw("awake",NAVY,"#fff",true),o.name+" app icon, light")}</div><div class="icon d">${svg(o.draw("awake","#fff",NAVY,true),o.name+" app icon, dark","--eye:#0F1B2D;--pupil:#FFFFFF;--feye:#FFFFFF")}</div></div>
    <div class="moods">${MOODS.map(([m,l])=>`<div class="mood">${svg(shadow+o.draw(m),o.name+", "+l.toLowerCase())}<b>${l}</b></div>`).join("")}</div>
  </div>
  <div class="notes"><div><b>Good</b>${o.good}</div><div><b>Watch out</b>${o.watch}</div></div></section>`).join("");
</script>
